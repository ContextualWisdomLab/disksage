[[bin]]
name = "disksage-uv-cache-reclaim"
path = "src/bin/disksage-uv-cache-reclaim.rs"

[[bin]]
name = "disksage-dev-artifacts"
path = "src/bin/disksage-dev-artifacts.rs"

[[bin]]
name = "disksage-provider-client-runtime"
path = "src/bin/disksage-provider-client-runtime.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-provider-recovery"
path = "src/bin/disksage-provider-recovery.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-podman-reclaim-plan"
path = "src/bin/disksage-podman-reclaim-plan.rs"

[[bin]]
name = "disksage-shared-temp-reclaim-plan"
path = "src/bin/disksage-shared-temp-reclaim-plan.rs"

[[bin]]
name = "disksage-container-orphan-plan"
path = "src/bin/disksage-container-orphan-plan.rs"

[[bin]]
name = "disksage-provider-oauth"
