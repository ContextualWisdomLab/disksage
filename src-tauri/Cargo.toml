[[test]]
name = "archive_tree_help_exit"
path = "tests/archive_tree_help_exit.rs"
required-features = ["archive-cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"
trash = "5.2.6"
blake3 = "1.8.5"
base64 = "0.23.1"
md-5 = "0.10.6"
oxttl = "0.2.3"
oxrdf = "0.3.3"
llama-cpp-2 = { version = "0.1.151", default-features = false, features = ["common"], optional = true }
sha2 = "0.11.0"
sha1 = "0.11.0"
same-file = "1.0.6"
tempfile = "3.27.0"
ureq = "3.3.0"
fs4 = "1.1.0"
dirs = "6.0.0"
unicode-normalization = "0.1"
unicode-general-category = "1.1.0"
csv = "1.4.0"
calamine = "0.36.0"
getrandom = "0.4.3"
keyring = "4.1.5"
zeroize = { version = "1.9.0", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
memchr = "2.8.3"
infer = "0.22.0"
png = "0.18.1"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
mail-parser = "0.11.5"
libc = "0.2"
mlsirm-core = { git = "https://github.com/ContextualWisdomLab/fast-mlsirm", rev = "4f9276b6fe6063f86c4cd4453fb72a13f3f6db11", default-features = false }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[target.'cfg(target_os = "macos")'.dependencies]
embed_plist = "1.2.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSObject", "NSString", "NSURL", "NSValue"] }
plist = "1"

[features]
volume-cli = []
archive-cli = []
cloud-cli = []
llm-engine = ["dep:llama-cpp-2"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"] }
