[package]
name = "disksage"
version = "0.1.0"
description = "Privacy-first desktop storage analysis and reclaim decision-support application."
license = "MIT"
repository = "https://github.com/ContextualWisdomLab/disksage"
publish = false
edition = "2021"
rust-version = "1.88"
default-run = "disksage"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "disksage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "disksage-volume-snapshot"
path = "src/bin/disksage-volume-snapshot.rs"
required-features = ["volume-cli"]

[[bin]]
name = "disksage-cloud-plan"
path = "src/bin/disksage-cloud-plan.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-cloud-local-inventory"
path = "src/bin/disksage-cloud-local-inventory.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-duplicate-audit"
path = "src/bin/disksage-duplicate-audit.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-photo-similarity-audit"
path = "src/bin/disksage-photo-similarity-audit.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-icloud-local-eviction"
path = "src/bin/disksage-icloud-local-eviction.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-icloud-local-eviction-batch"
path = "src/bin/disksage-icloud-local-eviction-batch.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-cloud-local-eviction-batch"
path = "src/bin/disksage-icloud-local-eviction-batch.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-multipart-archive-audit"
path = "src/bin/disksage-multipart-archive-audit.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-incomplete-download-audit"
path = "src/bin/disksage-incomplete-download-audit.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-incomplete-download-recovery"
path = "src/bin/disksage-incomplete-download-recovery.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-incomplete-download-materialization"
path = "src/bin/disksage-incomplete-download-materialization.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-incomplete-download-destination-plan"
path = "src/bin/disksage-incomplete-download-destination-plan.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-incomplete-download-materialize"
path = "src/bin/disksage-incomplete-download-materialize.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-git-worktree-audit"
path = "src/bin/disksage-git-worktree-audit.rs"

[[bin]]
name = "disksage-git-clone-reclaim"
path = "src/bin/disksage-git-clone-reclaim.rs"

[[bin]]
name = "disksage-git-checkout-lease"
path = "src/bin/disksage-git-checkout-lease.rs"

[[bin]]
name = "disksage-git-worktree-remove"
path = "src/bin/disksage-git-worktree-remove.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-icloud-sync-health"
path = "src/bin/disksage-icloud-sync-health.rs"
required-features = ["cloud-cli"]

[[bin]]
name = "disksage-archive-tree"
path = "src/bin/disksage-archive-tree.rs"
