name: PR 129 iCloud batch repair proof

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/icloud-batch-postmerge-verification' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify normalized repair source without executing repaired code
        run: |
          set -euo pipefail
          echo '46f143c8a01193d0189046fe70a98b1948a46be79bbf504ca520a401b69047c3  .github/scripts/repair_pr_89.py' | sha256sum --check --strict
          python .github/scripts/normalize_pr129.py
          echo '46962fff01de02d31f9b9f4c80f804a9726cb4d28a43552235aa2d684fbc9819  .github/scripts/repair_pr_89.py' | sha256sum --check --strict
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Add regression tests first
        run: python .github/scripts/repair_pr_89.py tests
      - name: Prove execution seam is absent before production repair
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli \
            cloud_local_eviction_batch::tests::execution_stops_after_first_failed_item_and_records_each_checkpoint \
            > /tmp/icloud-batch-core-red.log 2>&1
          status=$?
          set -e
          cat /tmp/icloud-batch-core-red.log
          test "$status" -ne 0
          grep -Eq 'BatchRecordWriter|execute_icloud_local_eviction_batch_with' /tmp/icloud-batch-core-red.log
      - name: Apply production execution repair
        run: python .github/scripts/repair_pr_89.py core
      - name: Prove execution safeguards and checkpoints
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli
          cloud_local_eviction_batch::tests::
      - name: Prove diagnostic split is absent before CLI repair
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli \
            --bin disksage-icloud-local-eviction-batch \
            control_locations_reject_symlinked_cloud_ancestors \
            > /tmp/icloud-batch-cli-red.log 2>&1
          status=$?
          set -e
          cat /tmp/icloud-batch-cli-red.log
          test "$status" -ne 0
          grep -F 'icloud-local-eviction-batch-record-dir-inside-cloud-data' /tmp/icloud-batch-cli-red.log
      - name: Apply CLI diagnostic repair
        run: python .github/scripts/repair_pr_89.py cli
      - name: Format repaired Rust sources
        run: |
          rustfmt --edition 2021 \
            src-tauri/src/cloud_local_eviction_batch.rs \
            src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs
      - name: Reverify formatted production sources
        run: |
          set -euo pipefail
          echo '5830a8cc201b0e92a6836970b8798397a5fabaca266e4ab3b6a3025eb759dd99  src-tauri/src/cloud_local_eviction_batch.rs' | sha256sum --check --strict
          echo '6ce392511604db36d4c6420a4430732fda6bfe263920f1edbc562799078d253a  src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs' | sha256sum --check --strict
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli cloud_local_eviction_batch::tests::
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-icloud-local-eviction-batch
          rustfmt --edition 2021 --check \
            src-tauri/src/cloud_local_eviction_batch.rs \
            src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs
          git diff --check
      - name: Replace temporary repair machinery with durable evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/normalize_pr129.py \
            .github/scripts/repair_pr_89.py \
            .github/workflows/pr129-icloud-batch-repair.yml \
            .github/workflows/repair-pr-89.yml \
            .github/workflows/repair-pr-89-final.yml \
            .github/workflows/repair-pr-89-timestamp.yml \
            docs/development/temporary-icloud-batch-repair.md
          cat > docs/development/icloud-local-eviction-batch.md <<'DOC'
          # iCloud local-copy batch eviction

          DiskSage treats iCloud local-copy eviction as a destructive, evidence-bound operation. Planning remains read-only; execution is unavailable until every selected item has been replanned, the exact batch fingerprint has been approved by an attributed human, and the immutable record directory is outside all cloud-controlled paths.

          ## Fail-closed execution contract

          - Every item receives a fresh clock reading; timestamps are never synthesized from a batch start time.
          - The executor stops at the first failed or verification-incomplete item.
          - A successful item result and a refreshed batch checkpoint are written before the next item begins.
          - Failure to persist an item result marks verification incomplete, records the bounded failure code in the batch checkpoint, and halts execution.
          - Manifest item-count and byte-size limits are enforced before parsing untrusted batch input.
          - Record, manifest, and lock paths reject cloud-controlled locations, including symlinked ancestors.
          - Control-path diagnostics remain distinct so operators can identify the exact rejected boundary without exposing source paths.

          ## Evidence and interoperability

          The public Rust coordinator exposes injected planner, executor, record-writer, and clock seams. These seams make halt order, checkpoint order, record failures, and per-item clock reads deterministic in tests without changing the production executor. JSON records continue to use the existing versioned DiskSage schemas and bounded error codes so standalone use and CWL service ingestion remain compatible.

          ## Verification

          Release acceptance requires the focused `cloud_local_eviction_batch::tests::` suite, the `disksage-icloud-local-eviction-batch` binary suite, formatting, whitespace validation, ordinary repository tests, security scans, and exact-head review gates to pass. The temporary repair workflows and scripts used to reproduce the regression are intentionally absent from the final source tree.
          DOC
          cat > CHANGELOG.md <<'DOC'
          # Changelog

          All notable changes to DiskSage are documented in this file.

          The format follows Keep a Changelog, and releases use Semantic Versioning.

          ## [Unreleased]

          ### Fixed

          - Hardened iCloud local-copy batch eviction with fresh per-item timestamps, deterministic planner/executor/recorder/clock seams, fail-closed immutable checkpoint handling, bounded manifest admission, symlink-safe control-path validation, and distinct operator diagnostics.

          ### Security

          - Removed obsolete one-shot repair workflows and patch scripts so repository automation no longer retains dormant write-capable recovery paths.
          DOC
          test ! -e .github/workflows/pr129-icloud-batch-repair.yml
          test ! -e .github/scripts/repair_pr_89.py
          test ! -e .github/workflows/repair-pr-89-final.yml
          test ! -e .github/workflows/repair-pr-89-timestamp.yml
          git diff --check
      - name: Commit exact validated repair with expected-head protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/fix/icloud-batch-postmerge-verification | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: integrate verified iCloud batch safeguards'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/fix/icloud-batch-postmerge-verification:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/fix/icloud-batch-postmerge-verification
