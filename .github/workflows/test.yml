name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Podman Rust formatting
        run: >-
          rustfmt --edition 2021 --check
          src-tauri/src/podman_desktop.rs
          src-tauri/tests/podman_desktop_documentation_contract.rs
          src-tauri/tests/podman_desktop_issue_privacy.rs
      - name: Rust tests (includes unix symlink test)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Headless cloud planner tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-cloud-plan
      - name: Exact duplicate audit tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli duplicate_audit
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-duplicate-audit
      - name: Extraction-free archive tree proof tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features archive-cli archive_git_tree
          cargo test --manifest-path src-tauri/Cargo.toml --features archive-cli --bin disksage-archive-tree
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
      - run: npm ci
      - run: npm test
      - run: npm run coverage
      - run: npm run check
      - run: npm run build

  coverage-evidence:
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-08-07
          components: llvm-tools-preview
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Measure exact-head Rust coverage
        run: >-
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml
          --branch --no-cfg-coverage --no-cfg-coverage-nightly
          --json --summary-only --output-path coverage.json
      - name: Build exact-head coverage evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const sha = process.env.HEAD_SHA ?? '';
          const repository = process.env.GITHUB_REPOSITORY ?? '';
          if (!/^[0-9a-f]{40}$/.test(sha) || repository.length === 0) {
            throw new Error('coverage evidence identity is invalid');
          }

          const report = JSON.parse(readFileSync('coverage.json', 'utf8'));
          const totals = report?.data?.[0]?.totals;
          const metric = (name, value) => {
            if (
              !value ||
              !Number.isFinite(value.count) ||
              !Number.isFinite(value.covered) ||
              !Number.isFinite(value.percent) ||
              value.count <= 0 ||
              value.covered !== value.count ||
              value.percent !== 100
            ) {
              throw new Error(`${name} coverage is not exactly 100%`);
            }
            return value.percent;
          };

          const evidence = {
            schema_version: 1,
            head_sha: sha,
            commit_sha: sha,
            repository,
            trust_tier: 'ci-verified',
            ci_server: 'github-actions',
            ci_workflow: 'Test',
            coverage_command: 'cargo llvm-cov',
            statement_coverage: metric('statement/region', totals?.regions),
            branch_coverage: metric('branch', totals?.branches),
            function_coverage: metric('function', totals?.functions),
            line_coverage: metric('line', totals?.lines),
            passed: true,
          };

          writeFileSync(
            'coverage-evidence.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE
      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-evidence
          path: coverage-evidence.json
          if-no-files-found: error

  llm-engine-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build deps (llama.cpp native + tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Build with llm-engine (compiles real llama.cpp CPU + engine.rs FFI)
        run: cargo test --manifest-path src-tauri/Cargo.toml --features llm-engine --lib --no-run
