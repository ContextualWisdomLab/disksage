name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Rust tests (includes unix symlink test)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Headless cloud planner tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-cloud-plan
      - name: Exact duplicate audit tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli duplicate_audit
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-duplicate-audit
      - name: Extraction-free archive tree proof tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features archive-cli archive_git_tree
          cargo test --manifest-path src-tauri/Cargo.toml --features archive-cli --bin disksage-archive-tree
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build

  llm-engine-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build deps (llama.cpp native + tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Build with llm-engine (compiles real llama.cpp CPU + engine.rs FFI)
        run: cargo test --manifest-path src-tauri/Cargo.toml --features llm-engine --lib --no-run

  # BEGIN TEMPORARY PR 129 ICLOUD BATCH REPAIR
  validate-icloud-batch-repair:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/icloud-batch-postmerge-verification' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable repair source
        run: echo '46f143c8a01193d0189046fe70a98b1948a46be79bbf504ca520a401b69047c3  .github/scripts/repair_pr_89.py' | sha256sum --check --strict
      - name: Normalize the audited repair anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/repair_pr_89.py')
          text = path.read_text(encoding='utf-8')

          old_raw = r'br#"{\\"plans\\":[]}"#'
          new_raw = r'br#"{\"plans\":[]}"#'
          if text.count(old_raw) != 2:
              raise SystemExit('raw-string repair anchors changed unexpectedly')
          text = text.replace(old_raw, new_raw)

          old_writer = r'        write_immutable_record(record_dir, name, value)\n'
          new_writer = r'        write_immutable_record(record_dir, name, value).map(|_| ())\n'
          if text.count(old_writer) != 1:
              raise SystemExit('immutable-writer repair anchor changed unexpectedly')
          text = text.replace(old_writer, new_writer)

          stale_loop_repair = '\n'.join((
              '    replace_once(',
              '        CORE,',
              "        '''    for (offset, (item, individual)) in plan\\n        .items\\n        .iter()\\n        .zip(individual_approvals.iter())\\n        .enumerate()\\n    {\\n''',",
              "        '''    for (item, individual) in plan.items.iter().zip(individual_approvals.iter()) {\\n''',",
              '    )',
              '',
          ))
          if text.count(stale_loop_repair) != 1:
              raise SystemExit('stale loop repair anchor changed unexpectedly')
          text = text.replace(stale_loop_repair, '', 1)

          stale_timestamp_repair = '\n'.join((
              '    replace_once(',
              '        CORE,',
              "        '''        let item_requested_at_ms =\\n            requested_at_ms.saturating_add(u64::try_from(offset).unwrap_or(u64::MAX));\\n        let execution = execute_icloud_local_eviction(\\n''',",
              "        '''        let item_requested_at_ms = fresh_item_requested_at_ms(&mut now_ms);\\n        let execution = executor(\\n''',",
              '    )',
              '',
          ))
          current_executor_repair = '\n'.join((
              '    replace_once(',
              '        CORE,',
              "        '''        let execution = execute_icloud_local_eviction(\\n''',",
              "        '''        let execution = executor(\\n''',",
              '    )',
              '',
          ))
          if text.count(stale_timestamp_repair) != 1:
              raise SystemExit('stale timestamp repair anchor changed unexpectedly')
          text = text.replace(stale_timestamp_repair, current_executor_repair, 1)

          if old_raw in text or old_writer in text:
              raise SystemExit('repair anchor normalization was incomplete')
          if text.count(new_raw) != 2 or text.count(new_writer) != 1:
              raise SystemExit('repair anchor normalization was not exact')
          if text.count(current_executor_repair) != 1:
              raise SystemExit('executor repair normalization was not exact')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Add regression tests first
        run: python .github/scripts/repair_pr_89.py tests
      - name: Prove execution-seam tests fail before production repair
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli \
            cloud_local_eviction_batch::tests::execution_stops_after_first_failed_item_and_records_each_checkpoint \
            > /tmp/icloud-batch-core-red.log 2>&1
          status=$?
          set -e
          cat /tmp/icloud-batch-core-red.log
          test "$status" -ne 0
          grep -Eq 'BatchRecordWriter|execute_icloud_local_eviction_batch_with' /tmp/icloud-batch-core-red.log
      - name: Apply execution repair
        run: python .github/scripts/repair_pr_89.py core
      - name: Prove execution-seam tests pass
        run: cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli cloud_local_eviction_batch::tests::
      - name: Prove diagnostic regression test fails before CLI repair
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli \
            --bin disksage-icloud-local-eviction-batch \
            control_locations_reject_symlinked_cloud_ancestors \
            > /tmp/icloud-batch-cli-red.log 2>&1
          status=$?
          set -e
          cat /tmp/icloud-batch-cli-red.log
          test "$status" -ne 0
          grep -F 'icloud-local-eviction-batch-record-dir-inside-cloud-data' /tmp/icloud-batch-cli-red.log
      - name: Apply CLI diagnostic repair
        run: python .github/scripts/repair_pr_89.py cli
      - name: Verify focused CLI and manifest boundaries
        run: cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-icloud-local-eviction-batch
      - name: Verify formatting and whitespace
        run: |
          rustfmt --edition 2021 --check \
            src-tauri/src/cloud_local_eviction_batch.rs \
            src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs
          git diff --check
      - name: Stage exact validated source evidence
        shell: bash
        run: |
          set -euo pipefail
          stage=repair-artifact
          mkdir -p "$stage/src-tauri/src/bin"
          cp src-tauri/src/cloud_local_eviction_batch.rs "$stage/src-tauri/src/cloud_local_eviction_batch.rs"
          cp src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs \
            "$stage/src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs"
          (
            cd "$stage"
            sha256sum \
              src-tauri/src/cloud_local_eviction_batch.rs \
              src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs \
              > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
      - name: Upload exact validated source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icloud-batch-repair-${{ github.event.pull_request.head.sha }}
          path: repair-artifact
          if-no-files-found: error
          retention-days: 1

  publish-icloud-batch-repair:
    needs: validate-icloud-batch-repair
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/icloud-batch-postmerge-verification' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify the same-run validation artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: icloud-batch-repair-${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > "$work/artifacts.json"
          artifact_count="$(jq --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length' "$work/artifacts.json")"
          test "$artifact_count" = 1
          artifact_id="$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .id' "$work/artifacts.json")"
          artifact_digest="$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .digest' "$work/artifacts.json")"
          test "${artifact_digest#sha256:}" != "$artifact_digest"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$work/artifact.zip"
          test "$(sha256sum "$work/artifact.zip" | cut -d' ' -f1)" = "${artifact_digest#sha256:}"
          mkdir "$work/evidence"
          unzip -q "$work/artifact.zip" -d "$work/evidence"
          test -f "$work/evidence/SHA256SUMS"
          (
            cd "$work/evidence"
            sha256sum --check --strict SHA256SUMS
          )
          cp "$work/evidence/src-tauri/src/cloud_local_eviction_batch.rs" \
            src-tauri/src/cloud_local_eviction_batch.rs
          cp "$work/evidence/src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs" \
            src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs
          expected="src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs
          src-tauri/src/cloud_local_eviction_batch.rs"
          test "$(git diff --name-only | sort)" = "$expected"
          git diff --check
      - name: Publish only the verified source repair to the unchanged head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")" = "$SOURCE_HEAD"
          expected="src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs
          src-tauri/src/cloud_local_eviction_batch.rs"
          test "$(git diff --name-only | sort)" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src-tauri/src/cloud_local_eviction_batch.rs \
            src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs
          git diff --cached --check
          git commit -m 'fix: verify iCloud batch execution safeguards'
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push \
            --force-with-lease="refs/heads/${SOURCE_BRANCH}:${SOURCE_HEAD}" \
            "$remote_url" \
            "HEAD:refs/heads/${SOURCE_BRANCH}"
