name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      # Content-checked by contract tests (vitest + cargo test) — must still run CI.
      - "!docs/doctoring/release-artifact-provenance.md"
      - "!docs/doctoring/tauri-content-security-policy.md"
      - "!docs/doctoring/model-artifact-integrity.md"
      - "!docs/doctoring/model-load-handle-binding.md"
      - "!docs/development/icloud-local-eviction-batch.md"
      - "!docs/architecture/goals/cloud-offload-goal.json"
      - "!CHANGELOG.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      # Content-checked by contract tests (vitest + cargo test) — must still run CI.
      - "!docs/doctoring/release-artifact-provenance.md"
      - "!docs/doctoring/tauri-content-security-policy.md"
      - "!docs/doctoring/model-artifact-integrity.md"
      - "!docs/doctoring/model-load-handle-binding.md"
      - "!docs/development/icloud-local-eviction-batch.md"
      - "!docs/architecture/goals/cloud-offload-goal.json"
      - "!CHANGELOG.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Test job checked out $actual_sha but expected source head $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev lsof
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          cache-targets: false
      - name: Configure private test temp
        run: |
          mkdir -p "$RUNNER_TEMP/disksage"
          echo "TMPDIR=$RUNNER_TEMP/disksage" >> "$GITHUB_ENV"
      - name: Rust tests (includes unix symlink test)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Headless cloud planner tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-cloud-plan
      - name: Exact duplicate audit tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli duplicate_audit
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-duplicate-audit
      - name: Extraction-free archive tree proof tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features archive-cli archive_git_tree
          cargo test --manifest-path src-tauri/Cargo.toml --features archive-cli --bin disksage-archive-tree
          cargo test --manifest-path src-tauri/Cargo.toml --features archive-cli --test archive_tree_help_exit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows-home-resolution:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $env:EXPECTED_SOURCE_SHA) {
            Write-Error "Test job checked out $actualSha but expected source head $env:EXPECTED_SOURCE_SHA"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Windows absolute-home regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          rustc --edition=2021 --test src-tauri/tests/home_resolution_contract.rs -o target/home-resolution-contract.exe
          & .\target\home-resolution-contract.exe
      - name: Windows development artifact home and allocation regressions
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --test dev_artifact_windows_home_contract
      - name: Windows Orca development artifact protection regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --test dev_artifact_orca_protection_contract
      - name: Windows worktree active-use Restart Manager regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --test git_worktree_windows_active_use
      - name: Windows worktree initial live-protection regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --test git_worktree_orca_protection_context live_orca_terminal_preserves_otherwise_removable_worktree -- --exact
      - name: Windows worktree post-approval live-protection regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --test git_worktree_orca_protection_context live_orca_terminal_arriving_after_approval_vetoes_removal_before_mutation -- --exact
      - name: Windows worktree audit-CLI protection acquisition regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --test git_worktree_orca_protection_context shipped_audit_cli_acquires_live_protection_inputs_and_requires_explicit_recent_window -- --exact
      - name: Windows worktree remove-CLI explicit recent-window validation regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --test git_worktree_remove_cli_contract orca_enabled_remove_requires_explicit_recent_write_window_before_execution -- --exact
      - name: Windows worktree remove-CLI stale-plan live-protection regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --test git_worktree_remove_cli_contract stale_approved_plan_is_rejected_when_live_protection_changes_removal_authority -- --exact
      - name: Windows worktree remove-CLI protection reacquisition regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --test git_worktree_orca_protection_context shipped_remove_cli_reacquires_live_protection_before_mutation -- --exact
      - name: Windows rebuild authority test target compile regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --test dev_artifact_rebuild_authority_contract --no-run
      - name: Windows Cargo manifest-only rejection regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --test dev_artifact_rebuild_authority_contract cargo_target_without_lockfile_is_rejected -- --exact
      - name: Windows Cargo manifest-plus-lock admission regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --test dev_artifact_rebuild_authority_contract cargo_target_with_manifest_and_lockfile_is_admitted -- --exact
      - name: Windows JavaScript project rebuild authority regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --test dev_artifact_rebuild_authority_contract javascript_generated_roots_require_package_manifest_and_recognized_lockfile -- --exact
      - name: Windows native Cargo cache authority regression
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --test dev_artifact_rebuild_authority_contract native_cargo_cache_tag_remains_independent_of_project_lockfiles -- --exact

  frontend-contracts-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $env:EXPECTED_SOURCE_SHA) {
            Write-Error "Frontend job checked out $actualSha but expected source head $env:EXPECTED_SOURCE_SHA"
            exit 1
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend contract tests
        run: npm test
      - name: Frontend production build
        run: npm run build

  llm-engine-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Test job checked out $actual_sha but expected source head $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: Install build deps (llama.cpp native + tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          cache-targets: false
      - name: Build with llm-engine (compiles real llama.cpp CPU + engine.rs FFI)
        run: cargo test --manifest-path src-tauri/Cargo.toml --features llm-engine --lib --no-run
