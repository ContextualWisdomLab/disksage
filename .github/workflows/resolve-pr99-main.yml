name: Resolve PR 99 against current main

on:
  push:
    branches:
      - feat/stale-worktree-audit
    paths:
      - .github/workflows/resolve-pr99-main.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/stale-worktree-audit
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main and preserve both safety lines of work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            git checkout --ours -- "$path"
            git add -- "$path"
          done < <(git diff --name-only --diff-filter=U)

          for path in package.json package-lock.json src-tauri/src/safety.rs; do
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              git checkout origin/main -- "$path"
            fi
          done

          python3 <<'PY'
          from pathlib import Path

          cargo = Path("src-tauri/Cargo.toml")
          text = cargo.read_text()
          if 'default-run = "disksage"' not in text:
              text = text.replace('edition = "2021"\n', 'edition = "2021"\ndefault-run = "disksage"\n', 1)
          volume_bin = '''[[bin]]
          name = "disksage-volume-snapshot"
          path = "src/bin/disksage-volume-snapshot.rs"
          required-features = ["volume-cli"]

          '''
          if 'name = "disksage-volume-snapshot"' not in text:
              text = text.replace('[[bin]]\n', volume_bin + '[[bin]]\n', 1)
          if '\nfs4 = "1.1.0"\n' not in text:
              text = text.replace('\nureq = "3.3.0"\n', '\nureq = "3.3.0"\nfs4 = "1.1.0"\n', 1)
          if '\nvolume-cli = []\n' not in text:
              text = text.replace('[features]\n', '[features]\nvolume-cli = []\n', 1)
          cargo.write_text(text)

          lib = Path("src-tauri/src/lib.rs")
          text = lib.read_text()
          if 'pub mod volume_pressure;' not in text:
              marker = 'pub mod semantic_catalog;\n'
              text = text.replace(marker, marker + 'pub mod volume_pressure;\n', 1)
          lib.write_text(text)

          readme = Path("README.md")
          text = readme.read_text()
          if '## Local volume evidence CLI' not in text:
              section = r'''## Local volume evidence CLI

DiskSage can capture a read-only, path-redacted filesystem-capacity snapshot:

```sh
cargo run --manifest-path src-tauri/Cargo.toml \
  --features volume-cli \
  --bin disksage-volume-snapshot -- --path /System/Volumes/Data
```

The JSON reports native `total`, `free`, and user-available bytes, allocation granularity,
available-space basis points, and a deterministic pressure band. It includes a SHA-256 evidence
fingerprint but never emits the queried path, mount name, account identifier, or file content.

To compare a fresh observation with a previously saved snapshot:

```sh
cargo run --manifest-path src-tauri/Cargo.toml \
  --features volume-cli \
  --bin disksage-volume-snapshot -- \
  --path /System/Volumes/Data \
  --baseline before.json \
  --logical-removed-bytes 3806089216
```

The comparison binds both complete snapshots and the calculated deltas. A logical removal count is
recorded as operator evidence only: `physical_reclaim_bytes` remains `null` and attribution remains
`unproven`, because APFS, sync providers, swap, builds, and other concurrent writers can change free
space during the same interval. Baselines are limited to a regular, non-symlink JSON file of at most
64 KiB.

'''
              text = text.replace('## Status\n', section + '## Status\n', 1)
          readme.write_text(text)
          PY

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved merge conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          rm .github/workflows/resolve-pr99-main.yml
          git add -A
          git diff --cached --check

      - name: Validate merged manifests and frontend tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null
          npm ci
          npm test

      - name: Commit and push resolved merge
        run: |
          git commit -m "merge main into feat/stale-worktree-audit"
          git push origin HEAD:feat/stale-worktree-audit
