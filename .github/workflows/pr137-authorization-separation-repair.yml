name: PR 137 Authorization Separation Repair

on:
  push:
    branches:
      - docs/acquisition-architecture-contract
    paths:
      - .github/workflows/pr137-authorization-separation-repair.yml

permissions:
  contents: read

concurrency:
  group: pr137-authorization-separation-repair
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'stage PR 137 authorization separation repair')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/acquisition-architecture-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse stale or unexpected source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "docs/acquisition-architecture-contract"
          git fetch --no-tags origin docs/acquisition-architecture-contract
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/docs/acquisition-architecture-contract)" = "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0

      - name: Install exact JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Prove the authorization-separation contract is red
        shell: bash
        run: |
          set -euo pipefail
          npx svelte-kit sync
          if npx vitest run src/lib/architectureDocumentation.test.ts; then
            echo "Expected the new authorization-separation contract to fail before doctoring repair." >&2
            exit 1
          fi

      - name: Apply exact reviewed doctoring repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one reviewed anchor, found {count}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "ARCHITECTURE.md",
              """At issuance, the authorization record contains an operation identifier, schema
          version, all scope fields, all fingerprints, the exact `repository_head_sha`,
          `issued_at_utc`, `expires_at_utc`, approver identity, rationale, and confirmation phrase.
          Rust computes `expires_at_utc` as exactly 15 minutes after `issued_at_utc`. The trusted
          Rust clock evaluates UTC expiry and, for an authorization created and consumed in one
          process, also requires monotonic elapsed time to remain below 15 minutes. At execution,
          Rust compares `repository_head_sha` with the current integrated repository head; any
          mismatch fails closed with `approval-scope-mismatch` before mutation.
          """,
              """At issuance, the runtime authorization record contains an operation identifier,
          schema version, all scope fields, all fingerprints, `issued_at_utc`, `expires_at_utc`,
          approver identity, rationale, and confirmation phrase. Rust computes `expires_at_utc` as
          exactly 15 minutes after `issued_at_utc`. The trusted Rust clock evaluates UTC expiry and,
          for an authorization created and consumed in one process, also requires monotonic elapsed
          time to remain below 15 minutes.

          Runtime authorization does not use a repository checkout or Git reference as an operator credential.
          A packaged process cannot establish repository state as an authorization fact without
          mixing local validation with durable authority. Runtime authorization is instead bound to
          operation scope, current fingerprints, executable schema, and trusted-clock freshness.
          Exact repository-head evidence remains a separate merge and release gate under Repository
          authorization and never substitutes for the human approval required for mutation.
          """,
          )

          replace_exact(
              "ARCHITECTURE.md",
              """Authorization is single-purpose. It cannot be reused for another candidate,
          destination, provider, account scope, operation class, plan revision, schema revision,
          or repository head.
          """,
              """Authorization is single-purpose. It cannot be reused for another candidate,
          destination, provider, account scope, operation class, plan revision, or schema revision.
          """,
          )

          replace_exact(
              "CHANGELOG.md",
              "- Bind every mutating authorization record to the exact integrated `repository_head_sha` and reject head drift with `approval-scope-mismatch` before execution.",
              "- Separate runtime mutation authorization from repository merge and release authorization: runtime approvals bind exact operation scope, fingerprints, schema, and trusted-clock freshness, while exact repository-head evidence remains a CI and release gate and never becomes an operator credential.",
          )
          PY

      - name: Verify the authorization-separation contract is green
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run src/lib/architectureDocumentation.test.ts

      - name: Publish only the verified exact repair
        shell: bash
        env:
          BRANCH_NAME: docs/acquisition-architecture-contract
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH_NAME"
          test "$(git rev-parse origin/$BRANCH_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ARCHITECTURE.md CHANGELOG.md
          git diff --cached --check
          changed="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' ARCHITECTURE.md CHANGELOG.md | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git commit -m "docs(security): separate runtime and repository authorization"
          git push origin "HEAD:$BRANCH_NAME"
