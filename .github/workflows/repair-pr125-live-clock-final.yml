name: Repair PR 125 live-clock approval boundary

# Re-trigger the audited one-shot repair after exact-head workflow inspection.
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: repair-pr125-live-clock-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'ContextualWisdomLab/disksage' &&
      github.actor == 'seonghobae' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/exact-cloud-copy-approval-lineage'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      transfer_sha: ${{ steps.digests.outputs.transfer_sha }}
      commands_sha: ${{ steps.digests.outputs.commands_sha }}
      cli_sha: ${{ steps.digests.outputs.cli_sha }}
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify immutable repair source and exact inputs
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git hash-object .github/scripts/repair_pr125_live_clock.py)" = "7b17235307c031e570d0f124f211fc76e13b5b67"
          test "$(git hash-object src-tauri/src/cloud_transfer.rs)" = "3146c21b99d74c6401816452faf682424ee22847"
          test "$(git hash-object src-tauri/src/commands.rs)" = "f4466d34613a51853a69b1f930038d0e5934928d"
          test "$(git hash-object src-tauri/src/bin/disksage-cloud-plan.rs)" = "9c30bb3b297648a621e5a9089ee66c9a3f33d3bb"
          python3 -m py_compile .github/scripts/repair_pr125_live_clock.py

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Add the regression test before production repair
        run: python3 .github/scripts/repair_pr125_live_clock.py tests

      - name: Prove the regression is red
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --lib \
            cloud_transfer::tests::production_copy_entrypoints_recheck_approval_age_against_live_time \
            --features cloud-cli > /tmp/pr125-live-clock-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr125-live-clock-red.log
          test "$status" -ne 0
          grep -Eq 'prepare_cloud_copy_with_approval|adopt_existing_cloud_copy_with_approval|E0061' \
            /tmp/pr125-live-clock-red.log

      - name: Apply the bounded production repair
        run: python3 .github/scripts/repair_pr125_live_clock.py production

      - name: Format and verify behavior
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          python3 .github/scripts/repair_pr125_live_clock.py verify
          cargo test --manifest-path src-tauri/Cargo.toml --lib \
            cloud_transfer::tests::production_copy_entrypoints_recheck_approval_age_against_live_time \
            --features cloud-cli
          cargo test --manifest-path src-tauri/Cargo.toml --lib cloud_transfer::tests --features cloud-cli
          cargo test --manifest-path src-tauri/Cargo.toml --lib naruon_lineage::tests --features cloud-cli
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-cloud-plan
          cargo check --manifest-path src-tauri/Cargo.toml --bins --features cloud-cli
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            src-tauri/src/bin/disksage-cloud-plan.rs \
            src-tauri/src/cloud_transfer.rs \
            src-tauri/src/commands.rs | sort)"

      - name: Bind exact validated source digests
        id: digests
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          echo "transfer_sha=$(sha256sum src-tauri/src/cloud_transfer.rs | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "commands_sha=$(sha256sum src-tauri/src/commands.rs | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cli_sha=$(sha256sum src-tauri/src/bin/disksage-cloud-plan.rs | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the exact validated pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable inputs and unchanged branch head
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: feat/exact-cloud-copy-approval-lineage
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git hash-object .github/scripts/repair_pr125_live_clock.py)" = "7b17235307c031e570d0f124f211fc76e13b5b67"
          encoded_branch="$(python - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('feat/exact-cloud-copy-approval-lineage', safe=''))
          PY
          )"
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" --jq '.commit.sha')"
          test "$live_head" = "$SOURCE_HEAD"

      - name: Reproduce only the validated transformation
        run: |
          python3 .github/scripts/repair_pr125_live_clock.py tests
          python3 .github/scripts/repair_pr125_live_clock.py production
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          python3 .github/scripts/repair_pr125_live_clock.py verify

      - name: Verify reproduced source digests
        env:
          EXPECTED_TRANSFER_SHA: ${{ needs.validate.outputs.transfer_sha }}
          EXPECTED_COMMANDS_SHA: ${{ needs.validate.outputs.commands_sha }}
          EXPECTED_CLI_SHA: ${{ needs.validate.outputs.cli_sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(sha256sum src-tauri/src/cloud_transfer.rs | cut -d' ' -f1)" = "$EXPECTED_TRANSFER_SHA"
          test "$(sha256sum src-tauri/src/commands.rs | cut -d' ' -f1)" = "$EXPECTED_COMMANDS_SHA"
          test "$(sha256sum src-tauri/src/bin/disksage-cloud-plan.rs | cut -d' ' -f1)" = "$EXPECTED_CLI_SHA"
          git diff --check

      - name: Publish exact repair and remove one-shot machinery
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: feat/exact-cloud-copy-approval-lineage
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm .github/scripts/repair_pr125_live_clock.py \
            .github/workflows/repair-pr125-live-clock-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/cloud_transfer.rs \
            src-tauri/src/commands.rs \
            src-tauri/src/bin/disksage-cloud-plan.rs \
            .github/scripts/repair_pr125_live_clock.py \
            .github/workflows/repair-pr125-live-clock-final.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' \
            .github/scripts/repair_pr125_live_clock.py \
            .github/workflows/repair-pr125-live-clock-final.yml \
            src-tauri/src/bin/disksage-cloud-plan.rs \
            src-tauri/src/cloud_transfer.rs \
            src-tauri/src/commands.rs | sort)"
          git diff --cached --check
          git commit -m "fix: bind cloud copy approval to live mutation time"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${SOURCE_HEAD}" \
            "$remote_url" "HEAD:refs/heads/${SOURCE_BRANCH}"
