name: Repair PR 41 Vite compatibility

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .github/workflows/repair-pr-41.yml

permissions:
  contents: read

concurrency:
  group: repair-pr-41-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'dependabot/npm_and_yarn/vite-8.1.5' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: dependabot/npm_and_yarn/vite-8.1.5
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Align the Svelte plugin with Vite 8
        run: npm install --save-dev '@sveltejs/vite-plugin-svelte@^7.2.0' --package-lock-only

      - name: Validate clean install and production behavior
        run: |
          npm ci
          npm test
          npm run check
          npm run build
          git diff --check

      - name: Publish the validated compatibility repair
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-41.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/repair-pr-41.yml
          git diff --cached --check
          git commit -m 'fix: align Svelte plugin with Vite 8'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/dependabot/npm_and_yarn/vite-8.1.5:${ORIGINAL_HEAD} \
            origin HEAD:refs/heads/dependabot/npm_and_yarn/vite-8.1.5
