name: Apply cloud inventory post-merge repair

on:
  push:
    branches:
      - fix/cloud-inventory-postmerge-review
    paths:
      - .github/workflows/apply-cloud-inventory-postmerge-repair.yml

permissions:
  contents: read

concurrency:
  group: apply-cloud-inventory-postmerge-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: fix/cloud-inventory-postmerge-review
          fetch-depth: 0
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Refresh dependency resolution before locked verification
        run: cargo check --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-cloud-local-inventory

      - name: Execute the reviewed repair program from the merged evidence workflow
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path('.github/workflows/repair-pr-67.yml')
          lines = workflow_path.read_text(encoding='utf-8').splitlines()
          target = '      - name: Apply complete bounded review fixes'
          try:
              step_index = lines.index(target)
          except ValueError as error:
              raise SystemExit('review repair step not found') from error
          run_index = next(
              index
              for index in range(step_index + 1, len(lines))
              if lines[index].strip() == 'run: |'
          )
          run_indent = len(lines[run_index]) - len(lines[run_index].lstrip())
          block = []
          for line in lines[run_index + 1:]:
              indentation = len(line) - len(line.lstrip())
              if line.strip() and indentation <= run_indent:
                  break
              block.append(line)
          nonblank_indents = [
              len(line) - len(line.lstrip()) for line in block if line.strip()
          ]
          if not nonblank_indents:
              raise SystemExit('review repair program is empty')
          common_indent = min(nonblank_indents)
          program = '\n'.join(
              line[common_indent:] if line.strip() else '' for line in block
          )
          exec(compile(program, 'cloud-inventory-postmerge-repair.py', 'exec'), {'__name__': '__main__'})

          changelog = Path('CHANGELOG.md')
          if not changelog.exists():
              changelog.write_text(
                  '# Changelog\n\n'
                  'All notable changes to DiskSage are documented in this file.\n\n'
                  '## [Unreleased]\n\n'
                  '### Fixed\n\n'
                  '- Bound multi-cloud inventory candidate and issue evidence while preserving deterministic priority ordering.\n'
                  '- Enforce batch-wide worker budgets, stable redacted failure reasons, and explicit unprocessed-root evidence.\n'
                  '- Remove the temporary PR repair workflow from the integrated product tree.\n',
                  encoding='utf-8',
              )

      - name: Format and validate the exact candidate
        run: |
          rustfmt src-tauri/src/cloud_local_inventory.rs
          rustfmt src-tauri/src/bin/disksage-cloud-local-inventory.rs
          git diff --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cloud_local_inventory::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-cloud-local-inventory
          cargo check --locked --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-cloud-local-inventory

      - name: Publish the validated repair and remove temporary workflows
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-67.yml
          rm .github/workflows/apply-cloud-inventory-postmerge-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            CHANGELOG.md \
            src-tauri/Cargo.lock \
            src-tauri/src/cloud_local_inventory.rs \
            src-tauri/src/bin/disksage-cloud-local-inventory.rs \
            .github/workflows/repair-pr-67.yml \
            .github/workflows/apply-cloud-inventory-postmerge-repair.yml
          git diff --cached --check
          git commit -m 'fix: harden merged cloud inventory evidence'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/fix/cloud-inventory-postmerge-review:${ORIGINAL_HEAD} \
            origin HEAD:refs/heads/fix/cloud-inventory-postmerge-review
