name: One-shot cloud copy docstrings

on:
  push:
    branches:
      - feat/exact-cloud-copy-approval-lineage
    paths:
      - .github/workflows/one-shot-cloud-copy-docstrings.yml

permissions:
  contents: write

concurrency:
  group: one-shot-cloud-copy-docstrings
  cancel-in-progress: false

jobs:
  apply-and-clean:
    if: >-
      github.repository == 'ContextualWisdomLab/disksage' &&
      github.ref == 'refs/heads/feat/exact-cloud-copy-approval-lineage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact branch head
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "feat/exact-cloud-copy-approval-lineage"
          git diff --exit-code

      - name: Apply bounded documentation repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 .github/scripts/apply_cloud_copy_docstrings.py
          python3 .github/scripts/apply_cloud_copy_docstrings.py --verify-only
          git diff --check
          git diff --name-only | sort > /tmp/changed-files.txt
          printf '%s\n' src-tauri/src/cloud_transfer.rs src/lib/api.ts | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt

      - name: Remove one-shot repair sources
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm .github/scripts/apply_cloud_copy_docstrings.py
          rm .github/workflows/one-shot-cloud-copy-docstrings.yml
          test ! -e .github/scripts/apply_cloud_copy_docstrings.py
          test ! -e .github/workflows/one-shot-cloud-copy-docstrings.yml
          git diff --check

      - name: Commit exact validated result
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- \
            src-tauri/src/cloud_transfer.rs \
            src/lib/api.ts \
            .github/scripts/apply_cloud_copy_docstrings.py \
            .github/workflows/one-shot-cloud-copy-docstrings.yml
          git diff --cached --check
          git commit -m 'docs: complete cloud copy approval API guidance'
          remote_url="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote_url" \
            "HEAD:refs/heads/feat/exact-cloud-copy-approval-lineage" \
            "--force-with-lease=refs/heads/feat/exact-cloud-copy-approval-lineage:${GITHUB_SHA}"
