name: Repair PR 125 backend approval phrases

on:
  push:
    branches:
      - feat/exact-cloud-copy-approval-lineage
    paths:
      - .github/workflows/repair-pr125-backend-approval-phrases.yml

permissions:
  contents: read

concurrency:
  group: repair-pr125-backend-approval-phrases
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/disksage' &&
      github.ref == 'refs/heads/feat/exact-cloud-copy-approval-lineage'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Bind repair to the audited parent head
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "e500eff8c6b5277dea97ee73d8f6ccc5de049222"
          test "$(git branch --show-current)" = "feat/exact-cloud-copy-approval-lineage"

      - name: Install Tauri build dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install JavaScript dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: npm ci

      - name: Add the backend-ownership regression first
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/tests/cloud_transfer_coverage_contract.rs")
          text = path.read_text(encoding="utf-8")
          marker = "fn cloud_copy_approval_phrases_are_backend_owned()"
          if marker in text:
              raise SystemExit("regression test already exists")
          text += r'''

          /// Verifies that approval phrases are generated by Rust and only selected by TypeScript.
          #[test]
          fn cloud_copy_approval_phrases_are_backend_owned() {
              let commands = include_str!("../src/commands.rs");
              let api = include_str!("../../src/lib/api.ts");

              assert!(
                  commands.contains("cloud_transfer::cloud_copy_approval_phrase("),
                  "the Tauri plan output must obtain exact phrases from the Rust approval function"
              );
              assert!(
                  commands.contains("copy_approval_phrases"),
                  "the Tauri plan output must publish backend-owned phrases"
              );
              assert!(
                  !api.contains("`DiskSage cloud ${action} ${candidate.review_fingerprint} 승인`"),
                  "TypeScript must not duplicate the security-sensitive approval format"
              );
              assert!(
                  api.contains("phraseSets[candidate.review_fingerprint]"),
                  "TypeScript must select the backend-returned phrase by exact review fingerprint"
              );
          }
          '''
          path.write_text(text, encoding="utf-8")
          PY

      - name: Prove the regression is red before production changes
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test cloud_transfer_coverage_contract \
            cloud_copy_approval_phrases_are_backend_owned \
            > /tmp/pr125-red.log 2>&1
          status=$?
          cat /tmp/pr125-red.log
          if [ "$status" -eq 0 ]; then
            echo "::error::backend-ownership regression unexpectedly passed before production repair"
            exit 1
          fi
          grep -F "the Tauri plan output must obtain exact phrases from the Rust approval function" \
            /tmp/pr125-red.log >/dev/null

      - name: Route UI approval phrases from the Rust plan output
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one anchor in {path}, found {count}: {old[:100]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src-tauri/src/commands.rs",
              '''/// Read-only cloud offload plan. The selected destination must be one of the roots discovered
/// on this machine; this command never creates a folder or moves a file.
#[cfg(not(coverage))]
#[tauri::command(async)]
pub async fn plan_cloud_archive(
    root: String,
    cloud_root: String,
    min_size_mib: u64,
    min_age_days: u64,
    limit: usize,
    app: AppHandle,
) -> Result<cloud::CloudPlanReport, String> {
    tauri::async_runtime::spawn_blocking(move || {
        let (_, report) =
            cloud_plan_for_inputs(&root, &cloud_root, min_size_mib, min_age_days, limit, &app)?;
        Ok(report)
    })
    .await
    .map_err(|_| "cloud-plan-task-failed".to_string())?
}
''',
              '''/// Backend-generated exact approval phrases for one immutable review fingerprint.
#[cfg(not(coverage))]
#[derive(Debug, Clone, PartialEq, Eq, serde::Serialize)]
pub struct CloudCopyApprovalPhraseSet {
    /// Phrase required before a copy-only action can be authorized.
    pub copy_only: String,
    /// Phrase required before an existing destination can be adopted.
    pub adopt_existing_copy: String,
}

/// Read-only cloud plan plus backend-owned approval phrases keyed by review fingerprint.
#[cfg(not(coverage))]
#[derive(Debug, Clone, serde::Serialize)]
pub struct CloudPlanOutput {
    /// Existing cloud plan fields remain flattened for wire compatibility.
    #[serde(flatten)]
    pub report: cloud::CloudPlanReport,
    /// Exact phrases generated by the same Rust function used during authorization.
    pub copy_approval_phrases:
        std::collections::BTreeMap<String, CloudCopyApprovalPhraseSet>,
}

/// Read-only cloud offload plan. The selected destination must be one of the roots discovered
/// on this machine; this command never creates a folder or moves a file.
#[cfg(not(coverage))]
#[tauri::command(async)]
pub async fn plan_cloud_archive(
    root: String,
    cloud_root: String,
    min_size_mib: u64,
    min_age_days: u64,
    limit: usize,
    app: AppHandle,
) -> Result<CloudPlanOutput, String> {
    tauri::async_runtime::spawn_blocking(move || {
        let (_, report) =
            cloud_plan_for_inputs(&root, &cloud_root, min_size_mib, min_age_days, limit, &app)?;
        let copy_approval_phrases = report
            .candidates
            .iter()
            .map(|candidate| {
                (
                    candidate.review_fingerprint.clone(),
                    CloudCopyApprovalPhraseSet {
                        copy_only: cloud_transfer::cloud_copy_approval_phrase(
                            candidate,
                            cloud_transfer::CloudCopyApprovalAction::CopyOnly,
                        ),
                        adopt_existing_copy: cloud_transfer::cloud_copy_approval_phrase(
                            candidate,
                            cloud_transfer::CloudCopyApprovalAction::AdoptExistingCopy,
                        ),
                    },
                )
            })
            .collect();
        Ok(CloudPlanOutput {
            report,
            copy_approval_phrases,
        })
    })
    .await
    .map_err(|_| "cloud-plan-task-failed".to_string())?
}
''',
          )

          replace_once(
              "src/lib/api.ts",
              '''export type CloudCopyApprovalAction = "copy-only" | "adopt-existing-copy";

export interface CloudCopyApproval {
''',
              '''export type CloudCopyApprovalAction = "copy-only" | "adopt-existing-copy";

export interface CloudCopyApprovalPhraseSet {
  copy_only: string;
  adopt_existing_copy: string;
}

export interface CloudCopyApproval {
''',
          )
          replace_once(
              "src/lib/api.ts",
              '''export interface CloudPlanReport {
  cloud_root: CloudRoot;
  generated_at_ms: number;
  candidates: CloudCandidate[];
''',
              '''export interface CloudPlanReport {
  cloud_root: CloudRoot;
  generated_at_ms: number;
  copy_approval_phrases: Record<string, CloudCopyApprovalPhraseSet>;
  candidates: CloudCandidate[];
''',
          )
          replace_once(
              "src/lib/api.ts",
              '''export const cloudCopyApprovalPhrase = (
  candidate: Pick<CloudCandidate, "review_fingerprint">,
  action: CloudCopyApprovalAction,
) => `DiskSage cloud ${action} ${candidate.review_fingerprint} 승인`;
''',
              '''export const cloudCopyApprovalPhrase = (
  candidate: Pick<CloudCandidate, "review_fingerprint">,
  action: CloudCopyApprovalAction,
  phraseSets: Readonly<Record<string, CloudCopyApprovalPhraseSet>>,
): string | null => {
  const phrases = phraseSets[candidate.review_fingerprint];
  if (!phrases) return null;
  return action === "copy-only" ? phrases.copy_only : phrases.adopt_existing_copy;
};
''',
          )

          replace_once(
              "src/lib/CloudArchive.svelte",
              '''  function adoptEligible(candidate: api.CloudCandidate): boolean {
    const decision = matchingReviewDecision(candidate);
    const exactApproval = decision?.disposition === "approved";
    const embeddedHighConfidence = candidate.production_time_confidence === "high"
      && candidate.production_time_source.startsWith("embedded:");
    return candidate.blocked_reason === "destination-exists"
      && (!candidate.requires_review || exactApproval)
      && (embeddedHighConfidence || exactApproval);
  }

  function reviewDecision(candidate: api.CloudCandidate): api.CloudReviewDecision | null {
''',
              '''  function adoptEligible(candidate: api.CloudCandidate): boolean {
    const decision = matchingReviewDecision(candidate);
    const exactApproval = decision?.disposition === "approved";
    const embeddedHighConfidence = candidate.production_time_confidence === "high"
      && candidate.production_time_source.startsWith("embedded:");
    return candidate.blocked_reason === "destination-exists"
      && (!candidate.requires_review || exactApproval)
      && (embeddedHighConfidence || exactApproval);
  }

  function copyApprovalPhrase(
    candidate: api.CloudCandidate,
    action: api.CloudCopyApprovalAction,
  ): string | null {
    return api.cloudCopyApprovalPhrase(
      candidate,
      action,
      report?.copy_approval_phrases ?? {},
    );
  }

  function reviewDecision(candidate: api.CloudCandidate): api.CloudReviewDecision | null {
''',
          )
          replace_once(
              "src/lib/CloudArchive.svelte",
              '''    if (exactConfirmationPhrase !== api.cloudCopyApprovalPhrase(candidate, "copy-only")
      || !approvalRationale) return;
''',
              '''    const expectedPhrase = copyApprovalPhrase(candidate, "copy-only");
    if (!expectedPhrase || exactConfirmationPhrase !== expectedPhrase || !approvalRationale) return;
''',
          )
          replace_once(
              "src/lib/CloudArchive.svelte",
              '''    if (exactConfirmationPhrase
        !== api.cloudCopyApprovalPhrase(candidate, "adopt-existing-copy")
      || !approvalRationale) return;
''',
              '''    const expectedPhrase = copyApprovalPhrase(candidate, "adopt-existing-copy");
    if (!expectedPhrase || exactConfirmationPhrase !== expectedPhrase || !approvalRationale) return;
''',
          )
          replace_once(
              "src/lib/CloudArchive.svelte",
              '<code>{api.cloudCopyApprovalPhrase(candidate, "copy-only")}</code>',
              '<code>{copyApprovalPhrase(candidate, "copy-only") ?? "승인 문구를 불러오지 못했습니다."}</code>',
          )
          replace_once(
              "src/lib/CloudArchive.svelte",
              '!== api.cloudCopyApprovalPhrase(candidate, "copy-only")}',
              '!== copyApprovalPhrase(candidate, "copy-only")\n                    || !copyApprovalPhrase(candidate, "copy-only")}',
          )
          replace_once(
              "src/lib/CloudArchive.svelte",
              '<code>{api.cloudCopyApprovalPhrase(candidate, "adopt-existing-copy")}</code>',
              '<code>{copyApprovalPhrase(candidate, "adopt-existing-copy") ?? "승인 문구를 불러오지 못했습니다."}</code>',
          )
          replace_once(
              "src/lib/CloudArchive.svelte",
              '!== api.cloudCopyApprovalPhrase(candidate, "adopt-existing-copy")}',
              '!== copyApprovalPhrase(candidate, "adopt-existing-copy")\n                    || !copyApprovalPhrase(candidate, "adopt-existing-copy")}',
          )

          replace_once(
              "src/lib/api.test.ts",
              '''describe("cloud copy approval phrase", () => {
  it("binds the exact review fingerprint and requested action", () => {
    const candidate = { review_fingerprint: "a".repeat(64) };
    expect(api.cloudCopyApprovalPhrase(candidate, "copy-only")).toBe(
      `DiskSage cloud copy-only ${"a".repeat(64)} 승인`,
    );
    expect(api.cloudCopyApprovalPhrase(candidate, "adopt-existing-copy")).toBe(
      `DiskSage cloud adopt-existing-copy ${"a".repeat(64)} 승인`,
    );
  });
});
''',
              '''describe("cloud copy approval phrase", () => {
  it("selects the backend-returned phrase for the exact review fingerprint", () => {
    const reviewFingerprint = "a".repeat(64);
    const candidate = { review_fingerprint: reviewFingerprint };
    const phraseSets = {
      [reviewFingerprint]: {
        copy_only: "backend copy-only approval",
        adopt_existing_copy: "backend existing-copy adoption",
      },
    };
    expect(api.cloudCopyApprovalPhrase(candidate, "copy-only", phraseSets)).toBe(
      "backend copy-only approval",
    );
    expect(api.cloudCopyApprovalPhrase(candidate, "adopt-existing-copy", phraseSets)).toBe(
      "backend existing-copy adoption",
    );
  });

  it("fails closed when the backend omitted the exact fingerprint", () => {
    const candidate = { review_fingerprint: "b".repeat(64) };
    expect(api.cloudCopyApprovalPhrase(candidate, "copy-only", {})).toBeNull();
    expect(api.cloudCopyApprovalPhrase(candidate, "adopt-existing-copy", {})).toBeNull();
  });
});
''',
          )

          replace_once(
              "CHANGELOG.md",
              '''### Security

''',
              '''### Security

- Generate exact cloud copy and existing-copy-adoption approval phrases in Rust and expose them with the read-only plan, so the UI cannot silently drift from the authorization validator and fails closed when phrase evidence is absent.
''',
          )
          PY

      - name: Format and verify the repaired exact tree
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test cloud_transfer_coverage_contract
          npm exec vitest -- run src/lib/api.test.ts
          npm run check
          cargo check --manifest-path src-tauri/Cargo.toml --features cloud-cli --bins
          git diff --check

      - name: Commit the exact repair and remove this one-shot workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_WORKFLOW_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORKFLOW_HEAD"
          git rm .github/workflows/repair-pr125-backend-approval-phrases.yml
          git add \
            CHANGELOG.md \
            src-tauri/src/commands.rs \
            src-tauri/tests/cloud_transfer_coverage_contract.rs \
            src/lib/api.ts \
            src/lib/api.test.ts \
            src/lib/CloudArchive.svelte
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: source cloud approval phrases from Rust"
          git push origin HEAD:feat/exact-cloud-copy-approval-lineage
