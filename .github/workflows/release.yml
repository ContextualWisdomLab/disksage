name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/verify-release-artifacts.sh"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/disksage-cloud-plan-linux-x86_64
              src-tauri/target/release/disksage-cloud-plan-linux-x86_64.sha256
              src-tauri/target/release/disksage-duplicate-audit-linux-x86_64
              src-tauri/target/release/disksage-duplicate-audit-linux-x86_64.sha256
            cloud_cli_source: src-tauri/target/release/disksage-cloud-plan
            cloud_cli_asset: src-tauri/target/release/disksage-cloud-plan-linux-x86_64
            duplicate_cli_source: src-tauri/target/release/disksage-duplicate-audit
            duplicate_cli_asset: src-tauri/target/release/disksage-duplicate-audit-linux-x86_64
          - os: windows-2022
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/disksage-cloud-plan-windows-x86_64.exe
              src-tauri/target/release/disksage-cloud-plan-windows-x86_64.exe.sha256
              src-tauri/target/release/disksage-duplicate-audit-windows-x86_64.exe
              src-tauri/target/release/disksage-duplicate-audit-windows-x86_64.exe.sha256
            cloud_cli_source: src-tauri/target/release/disksage-cloud-plan.exe
            cloud_cli_asset: src-tauri/target/release/disksage-cloud-plan-windows-x86_64.exe
            duplicate_cli_source: src-tauri/target/release/disksage-duplicate-audit.exe
            duplicate_cli_asset: src-tauri/target/release/disksage-duplicate-audit-windows-x86_64.exe
          - os: macos-latest
            bundles: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/disksage-cloud-plan-macos-arm64
              src-tauri/target/release/disksage-cloud-plan-macos-arm64.sha256
              src-tauri/target/release/disksage-duplicate-audit-macos-arm64
              src-tauri/target/release/disksage-duplicate-audit-macos-arm64.sha256
            cloud_cli_source: src-tauri/target/release/disksage-cloud-plan
            cloud_cli_asset: src-tauri/target/release/disksage-cloud-plan-macos-arm64
            duplicate_cli_source: src-tauri/target/release/disksage-duplicate-audit
            duplicate_cli_asset: src-tauri/target/release/disksage-duplicate-audit-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Linux system deps (tauri GTK + llama.cpp native)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev cmake clang libclang-dev

      - name: Install macOS build deps
        if: matrix.os == 'macos-latest'
        run: brew install cmake

      - name: Enable Windows Script Host for WiX MSI
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $engines = @(
            (Join-Path $env:windir 'System32\vbscript.dll'),
            (Join-Path $env:windir 'SysWOW64\vbscript.dll')
          ) | Where-Object { Test-Path $_ }
          if ($engines.Count -eq 0) {
            throw 'VBScript engine is unavailable on this runner.'
          }
          foreach ($engine in $engines) {
            $regsvr32 = Join-Path (Split-Path $engine) 'regsvr32.exe'
            $registration = Start-Process -FilePath $regsvr32 -ArgumentList @('/s', $engine) -Wait -PassThru
            if ($registration.ExitCode -ne 0) {
              throw "VBScript engine registration failed: $engine ($($registration.ExitCode))"
            }
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          cache-targets: false

      - name: Tauri build (with embedded LLM)
        run: npm run tauri -- build --features llm-engine

      - name: Diagnose WiX MSI linker failure
        if: failure() && matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $light = Join-Path $env:LOCALAPPDATA 'tauri\WixTools314\light.exe'
          $wix_dir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target\release\wix\x64'
          if (!(Test-Path -LiteralPath $light) -or !(Test-Path -LiteralPath $wix_dir)) {
            Write-Host 'WiX diagnostic inputs are unavailable.'
            exit 0
          }
          $wixobjs = @(Get-ChildItem -LiteralPath $wix_dir -Filter '*.wixobj' -File)
          $locale = Join-Path $wix_dir 'locale.wxl'
          $output = Join-Path $env:RUNNER_TEMP 'disksage-wix-diagnostic.msi'
          $arguments = @(
            '-ext', 'WixUIExtension',
            '-ext', 'WixUtilExtension',
            '-o', $output,
            '-cultures:en-us',
            '-loc', $locale
          ) + @($wixobjs.FullName) + @('-v')
          & $light @arguments
          Write-Host "WiX diagnostic exit code: $LASTEXITCODE"
          exit 0

      - name: Build operational CLIs
        run: >-
          cargo build --manifest-path src-tauri/Cargo.toml --release --features cloud-cli
          --bin disksage-cloud-plan --bin disksage-duplicate-audit

      - name: Stage and verify operational CLIs
        shell: bash
        run: |
          set -euo pipefail
          stage_cli() {
            local source_path="$1"
            local asset_path="$2"
            local usage_marker="$3"
            cp "$source_path" "$asset_path"
            local asset_dir asset_name help_stdout help_stderr
            asset_dir="$(dirname "$asset_path")"
            asset_name="$(basename "$asset_path")"
            help_stdout="$RUNNER_TEMP/${asset_name}.help.stdout"
            help_stderr="$RUNNER_TEMP/${asset_name}.help.stderr"
            if ! "$asset_path" --help >"$help_stdout" 2>"$help_stderr"; then
              printf '%s --help must exit successfully.\n' "$asset_name" >&2
              cat "$help_stderr" >&2
              return 1
            fi
            if [[ -s "$help_stderr" ]]; then
              printf '%s --help wrote to stderr on the successful path.\n' "$asset_name" >&2
              cat "$help_stderr" >&2
              return 1
            fi
            grep -F "$usage_marker" "$help_stdout"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd "$asset_dir" && sha256sum "$asset_name") >"$asset_path.sha256"
            else
              (cd "$asset_dir" && shasum -a 256 "$asset_name") >"$asset_path.sha256"
            fi
            test -s "$asset_path.sha256"
          }
          stage_cli "${{ matrix.cloud_cli_source }}" "${{ matrix.cloud_cli_asset }}" "usage: disksage-cloud-plan"
          stage_cli "${{ matrix.duplicate_cli_source }}" "${{ matrix.duplicate_cli_asset }}" "usage: disksage-duplicate-audit"

      - name: Verify macOS DMG app signature
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ ${#dmg_files[@]} -ne 1 ]]; then
            echo "Expected exactly one DMG, found ${#dmg_files[@]}" >&2
            exit 1
          fi
          mount_dir="$RUNNER_TEMP/disksage-dmg"
          mkdir -p "$mount_dir"
          cleanup() { hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          hdiutil attach "${dmg_files[0]}" -readonly -nobrowse -mountpoint "$mount_dir"
          app_bundles=("$mount_dir"/*.app)
          if [[ ${#app_bundles[@]} -ne 1 ]]; then
            echo "Expected exactly one app bundle, found ${#app_bundles[@]}" >&2
            exit 1
          fi
          test -f "${app_bundles[0]}/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "${app_bundles[0]}"
          codesign --display --verbose=4 "${app_bundles[0]}"

      - name: Upload release artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-disksage-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  download-artifact-pr-compat:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download exact release artifact set with v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-disksage-*-${{ github.run_attempt }}
          path: release-artifacts
          merge-multiple: false
      - name: Verify downloaded release artifact contract
        shell: bash
        run: bash .github/scripts/verify-release-artifacts.sh release-artifacts "${{ github.run_attempt }}"

  attest-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Download exact release artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-disksage-*-${{ github.run_attempt }}
          path: release-artifacts
          merge-multiple: false

      - name: Generate and validate source-bound SBOM
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          cargo metadata --locked --format-version=1 --manifest-path src-tauri/Cargo.toml >"$RUNNER_TEMP/disksage-cargo-metadata.json"
          mkdir -p release-artifacts/sbom
          node scripts/ci/generate-release-sbom.mjs \
            --cargo-metadata "$RUNNER_TEMP/disksage-cargo-metadata.json" \
            --npm-lock package-lock.json \
            --source-revision "$GITHUB_SHA" \
            --created "$(git show -s --format=%cI "$GITHUB_SHA")" \
            --output release-artifacts/sbom/disksage.spdx.json
          node scripts/ci/generate-release-sbom.mjs \
            --validate release-artifacts/sbom/disksage.spdx.json

      - name: Verify release artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          require_exactly_one_path() {
            local path_pattern="$1" label="$2" count=0
            while IFS= read -r -d ''; do count=$((count + 1)); done < <(find release-artifacts -type f -path "$path_pattern" -print0)
            if [[ $count -ne 1 ]]; then
              printf 'Expected exactly one %s, found %s.\n' "$label" "$count" >&2
              exit 1
            fi
          }
          require_exactly_one_file() {
            local file_name="$1" count=0
            while IFS= read -r -d ''; do count=$((count + 1)); done < <(find release-artifacts -type f -name "$file_name" -print0)
            if [[ $count -ne 1 ]]; then
              printf 'Expected exactly one release artifact named %s, found %s.\n' "$file_name" "$count" >&2
              exit 1
            fi
          }
          require_exactly_one_path '*/bundle/deb/*.deb' 'Debian bundle'
          require_exactly_one_path '*/bundle/appimage/*.AppImage' 'AppImage bundle'
          require_exactly_one_path '*/bundle/msi/*.msi' 'Windows MSI bundle'
          require_exactly_one_path '*/bundle/nsis/*.exe' 'Windows NSIS bundle'
          require_exactly_one_path '*/bundle/dmg/*.dmg' 'macOS DMG bundle'
          for required_name in \
            disksage-cloud-plan-linux-x86_64 \
            disksage-duplicate-audit-linux-x86_64 \
            disksage-cloud-plan-windows-x86_64.exe \
            disksage-duplicate-audit-windows-x86_64.exe \
            disksage-cloud-plan-macos-arm64 \
            disksage-duplicate-audit-macos-arm64; do
            require_exactly_one_file "$required_name"
            require_exactly_one_file "$required_name.sha256"
          done
          checksum_files=()
          checksum_file=""
          while IFS= read -r -d '' checksum_file; do checksum_files+=("$checksum_file"); done < <(find release-artifacts -type f -name '*.sha256' -print0)
          if [[ ${#checksum_files[@]} -ne 6 ]]; then
            printf 'Expected six operational CLI checksum files, found %s.\n' "${#checksum_files[@]}" >&2
            exit 1
          fi
          for checksum_file in "${checksum_files[@]}"; do
            checksum_dir="$(dirname "$checksum_file")"
            checksum_name="$(basename "$checksum_file")"
            expected_asset_name="${checksum_name%.sha256}"
            checksum_line="" line="" line_count=0
            while IFS= read -r line || [[ -n "$line" ]]; do
              line_count=$((line_count + 1))
              checksum_line="$line"
            done <"$checksum_file"
            if [[ $line_count -ne 1 ]]; then
              printf 'Checksum file %s must contain exactly one record.\n' "$checksum_name" >&2
              exit 1
            fi
            recorded_digest="" recorded_name="" extra_field=""
            read -r recorded_digest recorded_name extra_field <<<"$checksum_line"
            if [[ ! "$recorded_digest" =~ ^[0-9a-fA-F]{64}$ ]] || [[ "$recorded_name" != "$expected_asset_name" ]] || [[ -n "$extra_field" ]]; then
              printf 'Checksum file %s must reference its adjacent operational CLI %s exactly once.\n' "$checksum_name" "$expected_asset_name" >&2
              exit 1
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              (cd "$checksum_dir" && sha256sum --check "$checksum_name")
            elif command -v shasum >/dev/null 2>&1; then
              (cd "$checksum_dir" && shasum -a 256 --check "$checksum_name")
            else
              printf 'No SHA-256 checksum verifier is available.\n' >&2
              exit 1
            fi
          done
          require_exactly_one_file disksage.spdx.json
          node "$GITHUB_WORKSPACE/scripts/ci/generate-release-sbom.mjs" --validate "$(find release-artifacts -type f -name 'disksage.spdx.json' -print -quit)"
          unexpected_entry="$(find release-artifacts -mindepth 1 ! -type d ! -type f -print -quit)"
          if [[ -n "$unexpected_entry" ]]; then
            printf 'Unexpected release artifact entries: non-regular path %s is not publishable.\n' "$unexpected_entry" >&2
            exit 1
          fi
          regular_file_count=0
          while IFS= read -r -d ''; do regular_file_count=$((regular_file_count + 1)); done < <(find release-artifacts -type f -print0)
          if [[ $regular_file_count -ne 18 ]]; then
            printf 'Unexpected release artifact entries: expected exactly 18 regular files, found %s.\n' "$regular_file_count" >&2
            exit 1
          fi

      - name: Generate GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/**/*

      - name: Upload attested release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ github.run_attempt }}
          path: release-artifacts/sbom/disksage.spdx.json
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: attest-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download attested release artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-disksage-*-${{ github.run_attempt }}
          path: release-artifacts
          merge-multiple: false

      - name: Download attested release SBOM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-sbom-${{ github.run_attempt }}
          path: release-artifacts/sbom
      - name: Publish attested artifacts to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  gpu-build:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            features: "llm-engine,llama-cpp-2/cuda,llama-cpp-2/vulkan,llama-cpp-2/dynamic-backends"
          - os: windows-2022
            features: "llm-engine,llama-cpp-2/cuda,llama-cpp-2/dynamic-backends"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CMAKE_CUDA_ARCHITECTURES: "86"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev cmake clang libclang-dev glslang-tools
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "12.6.0"
          method: "network"
      - name: Install Vulkan SDK
        if: matrix.os == 'ubuntu-22.04'
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          version: "1.3.290.0"
          install_runtime: true
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: gpu
          cache-targets: false
      - name: Setup MSVC dev environment (Windows)
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Force Ninja generator (Windows)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - name: "Tauri build (GPU: CUDA [+ Vulkan on Linux] + dynamic backends)"
        run: npm run tauri -- build --no-bundle --features "${{ matrix.features }}"
      - name: Build engine smoke-test binary
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --no-run --features "${{ matrix.features }}" --lib
      - name: List built shared libs (diagnostic)
        if: always()
        shell: bash
        run: |
          echo "== target/release top =="; find src-tauri/target/release/ -maxdepth 1 -mindepth 1 -print 2>/dev/null | head -40 || true
          echo "== ggml/llama/cuda/vulkan libs under target =="; find src-tauri/target -maxdepth 8 -iregex '.*\(ggml\|llama\|cudart\|vulkan\).*\.\(dll\|so\|dylib\)' 2>/dev/null | head -60 || true
          echo "== out/backends dirs =="; find src-tauri/target -type d -name backends 2>/dev/null | head || true
          echo "== CUDA runtime dll/so =="; find "${CUDA_PATH:-/usr/local/cuda}" -iname 'cudart*' 2>/dev/null | head || true
      - name: Stage GPU run bundle
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p gpu-run
          find src-tauri/target/release -maxdepth 1 -type f \( -name 'disksage' -o -name 'disksage.exe' -o -name 'DiskSage' -o -name 'DiskSage.exe' \) -exec cp {} gpu-run/ \; 2>/dev/null || true
          tb=""
          for candidate in src-tauri/target/release/deps/disksage_lib-*; do
            [ -f "$candidate" ] || continue
            [[ "$candidate" =~ \.(d|pdb)$ ]] && continue
            if [ -z "$tb" ] || [ "$candidate" -nt "$tb" ]; then tb="$candidate"; fi
          done
          [ -n "$tb" ] && cp "$tb" "gpu-run/engine_smoketest${{ matrix.os == 'windows-2022' && '.exe' || '' }}" 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -iregex '.*\(ggml\|llama\).*\(\.dll\|\.so\|\.so\..*\)' -exec cp {} gpu-run/ \; 2>/dev/null || true
          for pat in 'cudart64_*.dll' 'cublas64_*.dll' 'cublasLt64_*.dll'; do
            find "${CUDA_PATH:-/usr/local/cuda}" -iname "$pat" -exec cp {} gpu-run/ \; 2>/dev/null || true
          done
          for pat in 'libcudart.so*' 'libcublas.so*' 'libcublasLt.so*'; do
            find "${CUDA_PATH:-/usr/local/cuda}" -iname "$pat" -exec cp -L {} gpu-run/ \; 2>/dev/null || true
          done
          echo "== staged =="; ls -la gpu-run/ || true
      - name: Upload GPU run bundle (for manual GPU verification)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disksage-gpu-${{ matrix.os }}
          path: gpu-run/
          if-no-files-found: warn
