name: Windows Worktree Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/windows-worktree-diagnostic.yml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/src/bin/disksage-git-worktree-remove.rs"
      - "src-tauri/tests/git_worktree_remove_cli_contract.rs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  diagnose-explicit-recent-window:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $env:EXPECTED_SOURCE_SHA) {
            Write-Error "Diagnostic job checked out $actualSha but expected source head $env:EXPECTED_SOURCE_SHA"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Capture focused remove-CLI contract output
        id: focused
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "disksage-worktree-remove-explicit-window.log"
          $exitFile = Join-Path $env:RUNNER_TEMP "disksage-worktree-remove-explicit-window.exit.txt"
          & cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --test git_worktree_remove_cli_contract orca_enabled_remove_requires_explicit_recent_write_window_before_execution -- --exact --nocapture *> $log
          $code = $LASTEXITCODE
          "exit_code=$code" | Set-Content -Path $exitFile -Encoding utf8
          Get-Content -Path $log
          if ($code -ne 0) {
            exit $code
          }
      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-worktree-remove-explicit-window-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/disksage-worktree-remove-explicit-window.log
            ${{ runner.temp }}/disksage-worktree-remove-explicit-window.exit.txt
          if-no-files-found: error
          retention-days: 1
