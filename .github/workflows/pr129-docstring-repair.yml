name: PR 129 production docstring repair

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: pr129-production-docstrings-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository == 'ContextualWisdomLab/disksage' &&
      github.actor == 'seonghobae' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/icloud-batch-postmerge-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      core_sha: ${{ steps.digests.outputs.core_sha }}
      cli_sha: ${{ steps.digests.outputs.cli_sha }}
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact repair inputs
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD:src-tauri/src/cloud_local_eviction_batch.rs)" = "bc3e23c011cba87d8fd1ec1a31ae1aa02cc055a2"
          test "$(git rev-parse HEAD:src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs)" = "2f9738ac5f2b8af7ed7aa2fd3022a7628622875b"
          echo "0e8acc012e4e506bce3ecb6ee624ac7e4e01b94cdbcba77f17cda5d3926619e7  .github/scripts/pr129_docstring_repair.py" |
            sha256sum --check --strict

      - name: Prove the docstring contract is red before repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          python .github/scripts/pr129_docstring_repair.py verify > /tmp/pr129-docstrings-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr129-docstrings-red.log
          test "$status" -ne 0
          grep -F "missing production docstrings:" /tmp/pr129-docstrings-red.log

      - name: Apply the bounded documentation repair
        run: python .github/scripts/pr129_docstring_repair.py apply

      - name: Prove complete production docstring evidence
        run: python .github/scripts/pr129_docstring_repair.py verify

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Verify focused production and CLI behavior
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli cloud_local_eviction_batch::tests::
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-icloud-local-eviction-batch
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --features cloud-cli

      - name: Verify private-item documentation and source formatting
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: |
          cargo doc --manifest-path src-tauri/Cargo.toml --no-deps --document-private-items --features cloud-cli
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs \
            src-tauri/src/cloud_local_eviction_batch.rs | sort)"

      - name: Bind exact validated source digests
        id: digests
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          echo "core_sha=$(sha256sum src-tauri/src/cloud_local_eviction_batch.rs | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cli_sha=$(sha256sum src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the exact validated pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable inputs and unchanged branch head
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: fix/icloud-batch-postmerge-verification
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          echo "0e8acc012e4e506bce3ecb6ee624ac7e4e01b94cdbcba77f17cda5d3926619e7  .github/scripts/pr129_docstring_repair.py" |
            sha256sum --check --strict
          encoded_branch="$(python - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('fix/icloud-batch-postmerge-verification', safe=''))
          PY
          )"
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" --jq '.commit.sha')"
          test "$live_head" = "$SOURCE_HEAD"

      - name: Reproduce only the validated source transformation
        run: python .github/scripts/pr129_docstring_repair.py apply

      - name: Verify reproduced source digests
        env:
          EXPECTED_CORE_SHA: ${{ needs.validate.outputs.core_sha }}
          EXPECTED_CLI_SHA: ${{ needs.validate.outputs.cli_sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(sha256sum src-tauri/src/cloud_local_eviction_batch.rs | cut -d' ' -f1)" = "$EXPECTED_CORE_SHA"
          test "$(sha256sum src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs | cut -d' ' -f1)" = "$EXPECTED_CLI_SHA"
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs \
            src-tauri/src/cloud_local_eviction_batch.rs | sort)"

      - name: Publish exact sources and remove temporary machinery
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: fix/icloud-batch-postmerge-verification
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm .github/scripts/pr129_docstring_repair.py .github/workflows/pr129-docstring-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs \
            src-tauri/src/cloud_local_eviction_batch.rs \
            .github/scripts/pr129_docstring_repair.py \
            .github/workflows/pr129-docstring-repair.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' \
            .github/scripts/pr129_docstring_repair.py \
            .github/workflows/pr129-docstring-repair.yml \
            src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs \
            src-tauri/src/cloud_local_eviction_batch.rs | sort)"
          git diff --cached --check
          git commit -m "docs: complete iCloud batch production docstrings"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${SOURCE_HEAD}" \
            "$remote_url" "HEAD:refs/heads/${SOURCE_BRANCH}"
