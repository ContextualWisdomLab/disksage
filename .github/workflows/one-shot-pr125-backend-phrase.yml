name: One-shot PR 125 backend approval phrase

on:
  push:
    branches:
      - feat/exact-cloud-copy-approval-lineage
    paths:
      - .github/workflows/one-shot-pr125-backend-phrase.yml

permissions: {}

concurrency:
  group: one-shot-pr125-backend-phrase
  cancel-in-progress: false

jobs:
  test-repair-and-clean:
    if: >-
      github.repository == 'ContextualWisdomLab/disksage' &&
      github.ref == 'refs/heads/feat/exact-cloud-copy-approval-lineage'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Verify exact branch head
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/exact-cloud-copy-approval-lineage | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code

      - name: Add regression tests and prove red
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 .github/scripts/repair_pr_125_backend_phrase.py --tests-only
          set +e
          rustc --test src-tauri/tests/cloud_transfer_coverage_contract.rs \
            -o /tmp/pr125-backend-phrase-red \
            >/tmp/pr125-backend-phrase-red.log 2>&1
          red_status=$?
          if [ "$red_status" -eq 0 ]; then
            /tmp/pr125-backend-phrase-red \
              >>/tmp/pr125-backend-phrase-red.log 2>&1
            red_status=$?
          fi
          set -e
          cat /tmp/pr125-backend-phrase-red.log
          test "$red_status" -ne 0
          test ! -e src-tauri/src/cloud_plan_view.rs
          git diff --check

      - name: Apply bounded implementation and prove green contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 .github/scripts/repair_pr_125_backend_phrase.py --implementation-only
          rustfmt --edition 2021 \
            src-tauri/src/cloud_plan_view.rs \
            src-tauri/src/commands.rs \
            src-tauri/src/lib.rs
          python3 .github/scripts/repair_pr_125_backend_phrase.py --verify-only
          rustc --test src-tauri/tests/cloud_transfer_coverage_contract.rs \
            -o /tmp/pr125-backend-phrase-green
          /tmp/pr125-backend-phrase-green
          git diff --check
          git diff --name-only | sort > /tmp/product-changed-files.txt
          printf '%s\n' \
            src-tauri/src/cloud_plan_view.rs \
            src-tauri/src/commands.rs \
            src-tauri/src/lib.rs \
            src-tauri/tests/cloud_transfer_coverage_contract.rs \
            src/lib/CloudArchive.svelte \
            src/lib/api.test.ts \
            src/lib/api.ts | sort > /tmp/product-expected-files.txt
          diff -u /tmp/product-expected-files.txt /tmp/product-changed-files.txt

      - name: Install Tauri system dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Verify focused Rust behavior
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib cloud_plan_view::tests
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test cloud_transfer_coverage_contract

      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0

      - name: Verify frontend contract and type safety
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          npm ci --ignore-scripts
          npm test -- src/lib/api.test.ts
          npm run check

      - name: Remove one-shot repair sources
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm .github/scripts/repair_pr_125_backend_phrase.py
          rm .github/workflows/one-shot-pr125-backend-phrase.yml
          test ! -e .github/scripts/repair_pr_125_backend_phrase.py
          test ! -e .github/workflows/one-shot-pr125-backend-phrase.yml
          git diff --check
          git diff --name-only | sort > /tmp/final-changed-files.txt
          printf '%s\n' \
            .github/scripts/repair_pr_125_backend_phrase.py \
            .github/workflows/one-shot-pr125-backend-phrase.yml \
            src-tauri/src/cloud_plan_view.rs \
            src-tauri/src/commands.rs \
            src-tauri/src/lib.rs \
            src-tauri/tests/cloud_transfer_coverage_contract.rs \
            src/lib/CloudArchive.svelte \
            src/lib/api.test.ts \
            src/lib/api.ts | sort > /tmp/final-expected-files.txt
          diff -u /tmp/final-expected-files.txt /tmp/final-changed-files.txt

      - name: Commit exact validated result
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- \
            .github/scripts/repair_pr_125_backend_phrase.py \
            .github/workflows/one-shot-pr125-backend-phrase.yml \
            src-tauri/src/cloud_plan_view.rs \
            src-tauri/src/commands.rs \
            src-tauri/src/lib.rs \
            src-tauri/tests/cloud_transfer_coverage_contract.rs \
            src/lib/CloudArchive.svelte \
            src/lib/api.test.ts \
            src/lib/api.ts
          git diff --cached --check
          git commit -m 'feat: source cloud approval phrase from Rust plan'
          remote_url="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote_url" \
            "HEAD:refs/heads/feat/exact-cloud-copy-approval-lineage" \
            "--force-with-lease=refs/heads/feat/exact-cloud-copy-approval-lineage:${GITHUB_SHA}"
