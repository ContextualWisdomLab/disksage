name: Repair PR 129 coverage seams and documentation

on:
  push:
    branches:
      - fix/icloud-batch-postmerge-verification
    paths:
      - .github/workflows/repair-pr129-coverage-seams.yml

permissions:
  contents: read

concurrency:
  group: repair-pr129-coverage-seams
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/disksage' &&
      github.ref == 'refs/heads/fix/icloud-batch-postmerge-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact audited inputs
        env:
          SOURCE_HEAD: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git hash-object src-tauri/src/cloud_local_eviction_batch.rs)" = \
            "bc3e23c011cba87d8fd1ec1a31ae1aa02cc055a2"
          test "$(git hash-object src-tauri/tests/icloud_local_eviction_batch_documentation_test.rs)" = \
            "84a698ee2407ad93cd00afae63a819a384225fbc"
          git ls-files --error-unmatch .github/repair-pr129-trigger.txt >/dev/null
          git ls-files --error-unmatch .github/scripts/finalize_pr129.py >/dev/null

      - name: Prove the documentation regression fails first
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 .github/scripts/finalize_pr129.py add-test
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test icloud_local_eviction_batch_documentation_test \
            batch_module_documents_every_production_function_and_support_item
          red_status=$?
          set -e
          test "$red_status" -ne 0

      - name: Apply the bounded production repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 .github/scripts/finalize_pr129.py apply-repair
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check

      - name: Verify normal and coverage configurations
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test icloud_local_eviction_batch_documentation_test
          cargo test --manifest-path src-tauri/Cargo.toml \
            --lib cloud_local_eviction_batch::tests
          RUSTFLAGS="--cfg coverage" cargo test --manifest-path src-tauri/Cargo.toml \
            --lib cloud_local_eviction_batch::tests
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Commit the exact repair and remove one-shot automation
        env:
          SOURCE_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: fix/icloud-batch-postmerge-verification
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python3 .github/scripts/finalize_pr129.py cleanup
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            .github/repair-pr129-trigger.txt \
            .github/scripts/finalize_pr129.py \
            .github/workflows/repair-pr129-coverage-seams.yml \
            src-tauri/src/cloud_local_eviction_batch.rs \
            src-tauri/tests/icloud_local_eviction_batch_documentation_test.rs | sort)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: document and cover iCloud batch seams"
          git push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${SOURCE_HEAD}" \
            origin "HEAD:refs/heads/${SOURCE_BRANCH}"
