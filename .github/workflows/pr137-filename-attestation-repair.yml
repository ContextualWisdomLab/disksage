name: PR 137 filename-attestation fixture repair

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - .github/workflows/pr137-filename-attestation-repair.yml

permissions:
  contents: read

concurrency:
  group: pr137-filename-attestation-repair-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 137 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/acquisition-architecture-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/acquisition-architecture-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse stale or unexpected source
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "docs/acquisition-architecture-contract"
          git fetch --no-tags origin docs/acquisition-architecture-contract
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/docs/acquisition-architecture-contract)" = "$EXPECTED_HEAD_SHA"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Prove the stale organization-scoped fixture is red
        shell: bash
        run: |
          set -euo pipefail
          if cargo test --manifest-path src-tauri/Cargo.toml --all-features \
            operator_decision_clears_only_the_matching_review_gate; then
            echo "The expected red regression no longer reproduces; refusing an unneeded repair." >&2
            exit 1
          fi

      - name: Align the remaining organization-scoped filename fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/cloud_transfer.rs")
          old = '"Filename date is auxiliary; destination and surrounding context were reviewed."'
          new = '"[organization-tenant-authority-confirmed] Filename date is auxiliary; destination and surrounding context were reviewed."'
          text = path.read_text(encoding="utf-8")
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one stale filename rationale, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify exact repaired tree
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-features \
            operator_decision_clears_only_the_matching_review_gate
          cargo test --manifest-path src-tauri/Cargo.toml --all-features
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Commit verified repair and remove the temporary workflow
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin docs/acquisition-architecture-contract
          test "$(git rev-parse origin/docs/acquisition-architecture-contract)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse --abbrev-ref HEAD)" = "docs/acquisition-architecture-contract"
          git rm .github/workflows/pr137-filename-attestation-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/cloud_transfer.rs
          changed="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/pr137-filename-attestation-repair.yml src-tauri/src/cloud_transfer.rs | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git commit -m "test(security): attest organization filename fixture"
          local_head="$(git rev-parse HEAD)"
          git push --atomic origin HEAD:refs/heads/docs/acquisition-architecture-contract
          git fetch --no-tags origin docs/acquisition-architecture-contract
          test "$(git rev-parse origin/docs/acquisition-architecture-contract)" = "$local_head"
