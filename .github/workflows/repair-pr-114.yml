name: Repair PR 114 Rust MSRV

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .github/workflows/repair-pr-114.yml

permissions:
  contents: read

concurrency:
  group: repair-pr-114-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'dependabot/cargo/src-tauri/sha1-0.11.0' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: dependabot/cargo/src-tauri/sha1-0.11.0
          fetch-depth: 0
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Declare the dependency-compatible MSRV
        shell: python
        run: |
          from pathlib import Path
          path = Path('src-tauri/Cargo.toml')
          content = path.read_text(encoding='utf-8')
          marker = 'edition = "2021"\n'
          replacement = 'edition = "2021"\nrust-version = "1.85"\n'
          if content.count(marker) != 1:
              raise SystemExit('Cargo package edition marker is not unique')
          if 'rust-version = ' not in content:
              content = content.replace(marker, replacement, 1)
          path.write_text(content, encoding='utf-8')

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.85.0

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: msrv-1.85

      - name: Verify the locked crate on the declared MSRV
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml --lib
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib sha1
          git diff --check

      - name: Publish the validated MSRV declaration
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-114.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/Cargo.toml .github/workflows/repair-pr-114.yml
          git diff --cached --check
          git commit -m 'build: declare Rust 1.85 MSRV'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/dependabot/cargo/src-tauri/sha1-0.11.0:${ORIGINAL_HEAD} \
            origin HEAD:refs/heads/dependabot/cargo/src-tauri/sha1-0.11.0
