name: PR 137 authorization fixture repair

on:
  push:
    branches:
      - docs/acquisition-architecture-contract
    paths:
      - .github/workflows/pr137-diagnose.yml

permissions:
  contents: read

concurrency:
  group: pr137-authorization-fixture-repair
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'stage PR 137 authorization fixture repair')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/acquisition-architecture-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse stale or unexpected source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "docs/acquisition-architecture-contract"
          git fetch --no-tags origin docs/acquisition-architecture-contract
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/docs/acquisition-architecture-contract)" = "$GITHUB_SHA"

      - name: Apply exact reviewed fixture corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected_count: int = 1) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              count = content.count(old)
              if count != expected_count:
                  raise SystemExit(
                      f"{path}: expected {expected_count} reviewed anchor(s), found {count}"
                  )
              target.write_text(content.replace(old, new), encoding="utf-8")

          replace_exact(
              "src-tauri/src/cloud_transfer.rs",
              '"Metadata title, account scope, and destination reviewed.",',
              '"[organization-tenant-authority-confirmed] Metadata title, account scope, and destination reviewed.",',
              expected_count=2,
          )
          replace_exact(
              "src-tauri/src/naruon_lineage.rs",
              '''        let decision = create_attributed_decision(
                      &candidate,
                      CloudReviewDisposition::Approved,
                      25,
                      "human:local:test",
                      "embedded metadata checked",
                  )
          ''',
              '''        let decision = create_attributed_decision(
                      &candidate,
                      CloudReviewDisposition::Approved,
                      25,
                      "human:local:test",
                      "[organization-tenant-authority-confirmed] embedded metadata checked",
                  )
          ''',
          )
          workflow = Path(".github/workflows/pr137-diagnose.yml")
          if not workflow.is_file():
              raise SystemExit("one-shot repair workflow source is missing")
          workflow.unlink()
          PY

      - name: Verify focused authorization regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml cloud_transfer::tests::operator_decision_clears_only_the_matching_review_gate -- --exact
          cargo test --manifest-path src-tauri/Cargo.toml naruon_lineage::tests::export_accepts_real_attributed_copy_receipt -- --exact

      - name: Verify complete Rust suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml
          git diff --check

      - name: Commit only the verified fixture corrections
        shell: bash
        env:
          BRANCH_NAME: docs/acquisition-architecture-contract
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH_NAME"
          test "$(git rev-parse origin/$BRANCH_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/pr137-diagnose.yml src-tauri/src/cloud_transfer.rs src-tauri/src/naruon_lineage.rs
          git diff --cached --check
          changed="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/pr137-diagnose.yml src-tauri/src/cloud_transfer.rs src-tauri/src/naruon_lineage.rs | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git commit -m "test(security): attest organization-scoped fixtures"
          git push origin "HEAD:$BRANCH_NAME"
