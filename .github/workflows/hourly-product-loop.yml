name: Hourly product loop

on:
  workflow_dispatch:

# DiskSage owns only the manual admission point. Review/model routing and any
# repair dispatch stay in the protected .github owner workflow pinned below.
permissions:
  contents: read
  id-token: write

jobs:
  review-repair:
    permissions:
      contents: read
      id-token: write
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-fix-scheduler.yml@e6334e229581a918e2f22de18733b76fa65d7e71
    with:
      target_repository: ContextualWisdomLab/disksage
      base_branch: main
      max_prs: "200"
      max_dispatches: "1"
      scan_window_size: "50"
      rotation_seed: ${{ format('{0}', github.run_number) }}
      retry_hours: "2"
      resolve_unreviewed_conflicts: true
