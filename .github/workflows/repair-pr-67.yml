name: Repair PR 67 review findings

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .github/workflows/repair-pr-67.yml

permissions:
  contents: read

concurrency:
  group: repair-pr-67-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/multicloud-local-inventory-batch' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feat/multicloud-local-inventory-batch
          fetch-depth: 0
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Apply bounded review fixes and regressions
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              return text.replace(old, new, 1)

          module_path = Path("src-tauri/src/cloud_local_inventory.rs")
          module = module_path.read_text(encoding="utf-8")
          module = replace_once(
              module,
              "const CHECKPOINT_ENTRY_INTERVAL: u64 = 256;\nconst CHECKPOINT_INTERVAL_MS: u64 = 1_000;",
              "const CHECKPOINT_ENTRY_INTERVAL: u64 = 256;\nconst CHECKPOINT_ISSUE_INTERVAL: u64 = 32;\nconst CHECKPOINT_INTERVAL_MS: u64 = 1_000;",
              "checkpoint constant",
          )
          module = replace_once(
              module,
              "    let issue_due = state.skipped_entries != cadence.skipped_entries;",
              "    let issue_due = state\n        .skipped_entries\n        .saturating_sub(cadence.skipped_entries)\n        >= CHECKPOINT_ISSUE_INTERVAL;",
              "checkpoint cadence",
          )
          if "fn issue_checkpoints_require_a_bounded_skipped_entry_delta()" not in module:
              marker = "\n    #[test]\n    fn inventories_allocated_files_without_claiming_sync_or_lineage() {"
              test = dedent(
                  """

                      #[test]
                      fn issue_checkpoints_require_a_bounded_skipped_entry_delta() {
                          let root = root(Path::new("/Cloud"));
                          let context = InventoryContext {
                              root: &root,
                              root_path: Path::new("/Cloud"),
                              options: options(),
                              observed_at_ms: 1,
                          };
                          let mut state = InventoryState::default();
                          let mut cadence = CheckpointCadence {
                              emitted: true,
                              ..CheckpointCadence::default()
                          };
                          let mut emitted = 0usize;
                          let mut emit = |_report: &CloudLocalAllocationInventory| {
                              emitted += 1;
                              Ok(())
                          };

                          state.skipped_entries = CHECKPOINT_ISSUE_INTERVAL - 1;
                          maybe_emit_checkpoint(context, &state, &mut cadence, 0, false, &mut emit)
                              .unwrap();
                          assert_eq!(emitted, 0);

                          state.skipped_entries = CHECKPOINT_ISSUE_INTERVAL;
                          maybe_emit_checkpoint(context, &state, &mut cadence, 0, false, &mut emit)
                              .unwrap();
                          assert_eq!(emitted, 1);
                      }
                  """
              )
              module = replace_once(module, marker, test + marker, "module test insertion")
          module_path.write_text(module, encoding="utf-8")

          cli_path = Path("src-tauri/src/bin/disksage-cloud-local-inventory.rs")
          cli = cli_path.read_text(encoding="utf-8")
          if "fn stable_batch_failure_reason(" not in cli:
              marker = "\n#[cfg(not(coverage))]\nfn inventory_all_roots("
              helper = dedent(
                  """

                      #[cfg(not(coverage))]
                      fn stable_batch_failure_reason(reason: &str) -> String {
                          let code = reason.split(':').next().unwrap_or_default();
                          if !code.is_empty()
                              && code.len() <= 128
                              && code.chars().all(|character| {
                                  character.is_ascii_lowercase()
                                      || character.is_ascii_digit()
                                      || character == '-'
                              })
                          {
                              code.to_string()
                          } else {
                              "cloud-local-inventory-root-failed".into()
                          }
                      }
                  """
              )
              cli = replace_once(cli, marker, helper + marker, "batch helper insertion")
          cli = replace_once(
              cli,
              "                reason,",
              "                reason: stable_batch_failure_reason(&reason),",
              "batch failure reason",
          )
          if "fn batch_failure_reason_discards_worker_stderr_details()" not in cli:
              marker = "\n    #[test]\n    fn batch_completion_requires_roots_and_complete_discovery_and_reports() {"
              test = dedent(
                  """

                      #[test]
                      fn batch_failure_reason_discards_worker_stderr_details() {
                          assert_eq!(
                              stable_batch_failure_reason(
                                  "inventory-worker-failed:/Users/private/customer-file: panic"
                              ),
                              "inventory-worker-failed"
                          );
                          assert_eq!(
                              stable_batch_failure_reason("INVALID:/secret"),
                              "cloud-local-inventory-root-failed"
                          );
                      }
                  """
              )
              cli = replace_once(cli, marker, test + marker, "CLI test insertion")
          cli_path.write_text(cli, encoding="utf-8")

      - name: Format changed Rust files
        run: |
          rustfmt src-tauri/src/cloud_local_inventory.rs
          rustfmt src-tauri/src/bin/disksage-cloud-local-inventory.rs

      - name: Run focused validation
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib cloud_local_inventory::tests
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-cloud-local-inventory
          cargo check --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-cloud-local-inventory

      - name: Commit validated repair and remove workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-67.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/cloud_local_inventory.rs src-tauri/src/bin/disksage-cloud-local-inventory.rs .github/workflows/repair-pr-67.yml
          git diff --cached --check
          git commit -m "fix: bound cloud inventory failure evidence"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/multicloud-local-inventory-batch
