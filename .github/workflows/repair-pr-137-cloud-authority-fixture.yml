name: Repair PR 137 cloud authority fixture

on:
  push:
    branches:
      - docs/acquisition-architecture-contract
    paths:
      - .github/workflows/repair-pr-137-cloud-authority-fixture.yml

permissions:
  contents: write

concurrency:
  group: repair-pr-137-cloud-authority-fixture
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: docs/acquisition-architecture-contract
          fetch-depth: 2

      - name: Refuse stale or broadened repair source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dae998b97c7ea148ac2b2243e087a0926e1b7c01"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/repair-pr-137-cloud-authority-fixture.yml"

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Apply the exact test-fixture correction
        shell: python
        run: |
          from pathlib import Path

          path = Path("src-tauri/src/cloud_transfer.rs")
          text = path.read_text(encoding="utf-8")
          old = '            "Filename date is auxiliary; destination and surrounding context were reviewed.",'
          new = '            "[organization-tenant-authority-confirmed] Filename date is auxiliary; destination and surrounding context were reviewed.",'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one stale fixture, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Verify the previously failing regression and formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml \
            cloud_transfer::tests::operator_decision_clears_only_the_matching_review_gate \
            -- --exact
          cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Commit only the verified bounded repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-137-cloud-authority-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/cloud_transfer.rs .github/workflows/repair-pr-137-cloud-authority-fixture.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/repair-pr-137-cloud-authority-fixture.yml' 'src-tauri/src/cloud_transfer.rs' | sort)"
          git diff --cached --check
          git commit -m "test: attest organization authority in filename review fixture"
          git push origin HEAD:docs/acquisition-architecture-contract
