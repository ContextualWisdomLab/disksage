name: Repair PR 188 stopped Podman evidence boundary

on:
  push:
    branches:
      - fix/podman-stopped-machine-evidence-v1
    paths:
      - .github/workflows/repair-pr188-stopped-podman-machine.yml

permissions:
  contents: write

concurrency:
  group: repair-pr188-stopped-podman-machine
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/podman-stopped-machine-evidence-v1
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact parent and isolated trigger
        env:
          EXPECTED_PARENT: d4bfa028cfdb5aee60643d8efa9cba109ffa8f0c
          TRIGGER_PATH: .github/workflows/repair-pr188-stopped-podman-machine.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "${{ github.event.before }}" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$TRIGGER_PATH"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Prove the focused regression is RED on the parent implementation
        run: |
          set -euo pipefail
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --test podman_reclaim_stopped_machine >red.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "stopped_machine_is_reported_and_skips_live_api_probes" red.log
          grep -F "FAILED" red.log

      - name: Apply the narrow fail-closed remedy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/podman_reclaim.rs")
          source = path.read_text(encoding="utf-8")

          anchor = '''    let machine = inspect.as_ref().map(|record| PodmanMachineEvidence {
              name: record.name.clone(),
              state: record.state.clone(),
              configured_disk_bytes: record
                  .resources
                  .disk_size_gib
                  .and_then(|gib| gib.checked_mul(GIB)),
          });

          let raw_image = inspect.as_ref().and_then(|record| {
          '''
          replacement = '''    let machine = inspect.as_ref().map(|record| PodmanMachineEvidence {
              name: record.name.clone(),
              state: record.state.clone(),
              configured_disk_bytes: record
                  .resources
                  .disk_size_gib
                  .and_then(|gib| gib.checked_mul(GIB)),
          });
          let machine_is_running = machine
              .as_ref()
              .is_some_and(|value| value.state.eq_ignore_ascii_case("running"));
          if machine.is_some() && !machine_is_running {
              issues.push("podman-machine-not-running".to_string());
          }

          let raw_image = inspect.as_ref().and_then(|record| {
          '''
          if source.count(anchor) != 1:
              raise SystemExit("machine-state insertion anchor changed")
          source = source.replace(anchor, replacement, 1)

          replacements = {
              "let store = inspect.as_ref().and_then(|_| {":
                  "let store = inspect.as_ref().filter(|_| machine_is_running).and_then(|_| {",
              "let system_df = inspect.as_ref().and_then(|_| {":
                  "let system_df = inspect.as_ref().filter(|_| machine_is_running).and_then(|_| {",
              "let unused_images = inspect.as_ref().and_then(|_| {":
                  "let unused_images = inspect.as_ref().filter(|_| machine_is_running).and_then(|_| {",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"expected one probe anchor: {old}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check

      - name: Verify RED to GREEN and the full Rust suite
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --test podman_reclaim_stopped_machine
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Commit only the verified repair
        env:
          BRANCH_NAME: fix/podman-stopped-machine-evidence-v1
          TRIGGER_PATH: .github/workflows/repair-pr188-stopped-podman-machine.yml
        run: |
          set -euo pipefail
          rm "$TRIGGER_PATH" red.log
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/repair-pr188-stopped-podman-machine.yml\nsrc-tauri/src/podman_reclaim.rs'
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-agent@users.noreply.github.com"
          git add src-tauri/src/podman_reclaim.rs "$TRIGGER_PATH"
          git commit -m "fix: fail closed for stopped Podman machine evidence"
          git fetch origin "$BRANCH_NAME"
          test "$(git rev-parse "origin/$BRANCH_NAME")" = "$(git rev-parse HEAD^)"
          git push origin "HEAD:$BRANCH_NAME"
