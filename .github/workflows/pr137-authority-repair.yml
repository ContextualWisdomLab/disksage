name: PR 137 Exact Authority Repair

on:
  push:
    branches:
      - docs/acquisition-architecture-contract
    paths:
      - .github/workflows/pr137-authority-repair.yml

permissions:
  contents: read

concurrency:
  group: pr137-exact-authority-repair
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'stage exact PR 137 authority repair')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/acquisition-architecture-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse stale or unexpected source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "docs/acquisition-architecture-contract"
          git fetch --no-tags origin docs/acquisition-architecture-contract
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/docs/acquisition-architecture-contract)" = "$GITHUB_SHA"

      - name: Apply exact reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one reviewed anchor, found {count}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "src-tauri/src/cloud_transfer.rs",
              """    let organization_tenant_authority_required = candidate.destination_account_scope
                  == CloudAccountScope::Organization
                  && candidate
                      .review_reasons
                      .iter()
                      .any(|reason| reason == ORGANIZATION_TENANT_AUTHORITY_REVIEW_REASON);
          """,
              """    let organization_tenant_authority_required = candidate.destination_account_scope
                  == CloudAccountScope::Organization
                  || candidate
                      .review_reasons
                      .iter()
                      .any(|reason| reason == ORGANIZATION_TENANT_AUTHORITY_REVIEW_REASON);
          """,
          )

          replace_exact(
              "ARCHITECTURE.md",
              """The authorization record contains an operation identifier, schema version, all scope
          fields, all fingerprints, `issued_at_utc`, `expires_at_utc`, approver identity,
          rationale, and confirmation phrase. Rust computes `expires_at_utc` as exactly 15
          minutes after `issued_at_utc`. The trusted Rust clock evaluates UTC expiry and, for an
          authorization created and consumed in one process, also requires monotonic elapsed time
          to remain below 15 minutes.
          """,
              """At issuance, the authorization record contains an operation identifier, schema
          version, all scope fields, all fingerprints, the exact `repository_head_sha`,
          `issued_at_utc`, `expires_at_utc`, approver identity, rationale, and confirmation phrase.
          Rust computes `expires_at_utc` as exactly 15 minutes after `issued_at_utc`. The trusted
          Rust clock evaluates UTC expiry and, for an authorization created and consumed in one
          process, also requires monotonic elapsed time to remain below 15 minutes. At execution,
          Rust compares `repository_head_sha` with the current integrated repository head; any
          mismatch fails closed with `approval-scope-mismatch` before mutation.
          """,
          )

          replace_exact(
              "ARCHITECTURE.md",
              "Supply-chain Levels for Software Artifacts. (2026). *SLSA specification, version\n1.2*.",
              "Supply-chain Levels for Software Artifacts. (2025). *SLSA specification, version\n1.2*.",
          )

          replace_exact(
              "docs/architecture/cloud-review-tenant-authority.md",
              "An approved decision is accepted only when its rationale starts with the exact backend-defined marker `[organization-tenant-authority-confirmed] ` whenever the predicate is true.",
              "An approved decision is accepted only when its rationale starts with the exact backend-defined marker `[organization-tenant-authority-confirmed]` followed by exactly one U+0020 ASCII space whenever the predicate is true.",
          )

          replace_exact(
              "docs/architecture/cloud-review-tenant-authority.md",
              "Joint Task Force. (2020). *Security and privacy controls for information systems and organizations* (NIST Special Publication 800-53 Rev. 5, updates through Release 5.2.0). National Institute of Standards and Technology. https://doi.org/10.6028/NIST.SP.800-53r5",
              "Joint Task Force. (2020). *Security and privacy controls for information systems and organizations* (NIST Special Publication 800-53 Rev. 5). National Institute of Standards and Technology. https://doi.org/10.6028/NIST.SP.800-53r5\n\nNational Institute of Standards and Technology. (2025, August 27). *NIST releases revision to SP 800-53 controls*. https://csrc.nist.gov/News/2025/nist-releases-revision-to-sp-800-53-controls",
          )

          replace_exact(
              "CHANGELOG.md",
              "- Require explicit organization-tenant authority when either the organization destination scope or the organization-sensitive review reason is present, preventing a missing or contradictory candidate field from making cloud approval less restrictive; record the fail-closed decision, rollback boundary, tests, and APA 7th references in `docs/architecture/cloud-review-tenant-authority.md`.",
              "- Require explicit organization-tenant authority in both the frontend projection and durable Rust transfer gate when either the organization destination scope or the organization-sensitive review reason is present, preventing a missing, contradictory, or malformed candidate field from making cloud approval less restrictive; record the fail-closed decision, rollback boundary, realistic signal-matrix tests, and APA 7th references in `docs/architecture/cloud-review-tenant-authority.md`.\n- Bind every mutating authorization record to the exact integrated `repository_head_sha` and reject head drift with `approval-scope-mismatch` before execution.",
          )

          workflow = Path(".github/workflows/pr137-authority-repair.yml")
          if not workflow.is_file():
              raise SystemExit("one-shot workflow source is missing")
          workflow.unlink()
          PY

      - name: Format and verify Rust repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Install Tauri test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Verify durable tenant-authority signal matrix
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --test cloud_transfer_tenant_authority_gate

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0

      - name: Verify architecture and reference contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx svelte-kit sync
          npx vitest run src/lib/architectureDocumentation.test.ts

      - name: Publish only the verified exact repair
        shell: bash
        env:
          BRANCH_NAME: docs/acquisition-architecture-contract
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH_NAME"
          test "$(git rev-parse origin/$BRANCH_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          changed="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/pr137-authority-repair.yml \
            ARCHITECTURE.md \
            CHANGELOG.md \
            docs/architecture/cloud-review-tenant-authority.md \
            src-tauri/src/cloud_transfer.rs | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git commit -m "fix: enforce durable tenant authority boundaries"
          git push origin "HEAD:$BRANCH_NAME"
