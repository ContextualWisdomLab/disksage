name: Repair PR 125 coverage cfg mismatch

on:
  push:
    branches:
      - feat/exact-cloud-copy-approval-lineage
    paths:
      - .github/workflows/repair-pr125-coverage-cfg.yml

permissions:
  contents: read

concurrency:
  group: repair-pr125-coverage-cfg
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/disksage' &&
      github.ref == 'refs/heads/feat/exact-cloud-copy-approval-lineage'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply and publish the exact bounded repair
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: feat/exact-cloud-copy-approval-lineage
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          report_failure() {
            status=$?
            gh pr comment 125 --repo "$GITHUB_REPOSITORY" \
              --body "PR125 exact-head repair failed on \`$SOURCE_HEAD\` with status \`$status\`; inspect workflow \`$GITHUB_RUN_ID\` before retrying." \
              >/dev/null 2>&1 || true
            exit "$status"
          }
          trap report_failure ERR

          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git hash-object src-tauri/src/cloud_transfer.rs)" = \
            "a4b3fd760b2f890046e9d5ff5c8f219b73596ae3"
          git ls-files --error-unmatch .github/repair-pr125-trigger.txt >/dev/null

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/cloud_transfer.rs")
          source = path.read_text(encoding="utf-8")
          old = "#[cfg(all(test, not(coverage)))]\nfn test_copy_approval("
          new = "#[cfg(test)]\nfn test_copy_approval("
          if source.count(old) != 1:
              raise SystemExit(f"expected one audited cfg anchor, found {source.count(old)}")
          repaired = source.replace(old, new, 1)
          if repaired.count(new) != 1:
              raise SystemExit("green cfg contract missing or duplicated")
          path.write_text(repaired, encoding="utf-8")
          PY

          rm .github/workflows/repair-pr125-coverage-cfg.yml \
            .github/repair-pr125-trigger.txt
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            .github/repair-pr125-trigger.txt \
            .github/workflows/repair-pr125-coverage-cfg.yml \
            src-tauri/src/cloud_transfer.rs | sort)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: compile cloud transfer tests under coverage"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${SOURCE_HEAD}" \
            "$remote_url" "HEAD:refs/heads/${SOURCE_BRANCH}"
          trap - ERR
