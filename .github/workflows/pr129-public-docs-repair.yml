name: Repair PR 129 public API documentation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: pr129-public-docs-repair-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/icloud-batch-postmerge-verification' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact audited parent and trigger-only delta
        env:
          EXPECTED_PARENT: 9f6a7c6f6dc1017f757dcc49643bbab412943171
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr129-public-docs-repair.yml"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Apply deterministic documentation repair
        env:
          REPAIR_SCRIPT_B64: 
        run: |
          set -euo pipefail
          printf '%s' "${REPAIR_SCRIPT_B64}" | base64 --decode > "${RUNNER_TEMP}/repair_pr129_docs.py"
          python "${RUNNER_TEMP}/repair_pr129_docs.py"

      - name: Format and validate focused Rust behavior
        run: |
          rustfmt src-tauri/src/cloud_local_eviction_batch.rs
          cargo test --manifest-path src-tauri/Cargo.toml --lib cloud_local_eviction_batch::tests
          cargo check --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-icloud-local-eviction-batch
          git diff --check

      - name: Commit exact validated documentation and remove workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin fix/icloud-batch-postmerge-verification
          test "$(git rev-parse origin/fix/icloud-batch-postmerge-verification)" = "${ORIGINAL_HEAD}"
          rm .github/workflows/pr129-public-docs-repair.yml
          test "$(git diff --name-only | sort)" = $'.github/workflows/pr129-public-docs-repair.yml\nsrc-tauri/src/cloud_local_eviction_batch.rs'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/cloud_local_eviction_batch.rs .github/workflows/pr129-public-docs-repair.yml
          git diff --cached --check
          git commit -m "docs: complete iCloud batch public API guidance"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/fix/icloud-batch-postmerge-verification:${ORIGINAL_HEAD} \
            origin HEAD:refs/heads/fix/icloud-batch-postmerge-verification
