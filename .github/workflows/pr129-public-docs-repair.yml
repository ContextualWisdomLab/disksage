name: Repair PR 129 public API documentation

on:
  push:
    branches:
      - fix/icloud-batch-postmerge-verification
    paths:
      - .github/workflows/pr129-public-docs-repair.yml

permissions:
  contents: read

concurrency:
  group: pr129-public-docs-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/icloud-batch-postmerge-verification
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact audited parent and trigger-only delta
        env:
          EXPECTED_PARENT: d1f419d3d59fa9c79a3b6407aa4e85a714b7b257
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr129-public-docs-repair.yml"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Apply the audited documentation repair from the immutable parent
        shell: python
        run: |
          import subprocess
          import sys

          workflow_path = ".github/workflows/pr129-public-docs-repair.yml"
          previous = subprocess.check_output(
              ["git", "show", f"HEAD^:{workflow_path}"], text=True
          ).splitlines()
          marker = "      - name: Add beginner-readable public API documentation"
          try:
              marker_index = previous.index(marker)
              run_index = next(
                  index
                  for index in range(marker_index + 1, len(previous))
                  if previous[index] == "        run: |"
              )
          except (ValueError, StopIteration) as error:
              raise SystemExit("audited documentation repair script was not found") from error

          script_lines = []
          for line in previous[run_index + 1 :]:
              if line.startswith("      - name:"):
                  break
              if line.startswith("          "):
                  script_lines.append(line[10:])
              elif not line.strip():
                  script_lines.append("")
              else:
                  raise SystemExit(f"unexpected indentation in audited script: {line!r}")
          script = "\n".join(script_lines) + "\n"
          if "source_path.write_text(source, encoding=\"utf-8\")" not in script:
              raise SystemExit("audited script integrity marker is absent")
          exec(compile(script, f"{workflow_path}@HEAD^", "exec"), {"__name__": "__main__"})

      - name: Format and validate focused Rust behavior
        run: |
          rustfmt src-tauri/src/cloud_local_eviction_batch.rs
          cargo test --manifest-path src-tauri/Cargo.toml --lib cloud_local_eviction_batch::tests
          cargo check --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-icloud-local-eviction-batch
          git diff --check

      - name: Commit exact validated documentation and remove workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/fix/icloud-batch-postmerge-verification)" = "${ORIGINAL_HEAD}"
          rm .github/workflows/pr129-public-docs-repair.yml
          test "$(git diff --name-only | sort)" = $'.github/workflows/pr129-public-docs-repair.yml\nsrc-tauri/src/cloud_local_eviction_batch.rs'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/cloud_local_eviction_batch.rs \
            .github/workflows/pr129-public-docs-repair.yml
          git diff --cached --check
          git commit -m "docs: complete iCloud batch public API guidance"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/fix/icloud-batch-postmerge-verification:${ORIGINAL_HEAD} \
            origin HEAD:refs/heads/fix/icloud-batch-postmerge-verification
