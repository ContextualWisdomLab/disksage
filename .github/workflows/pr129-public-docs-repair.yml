name: Repair PR 129 public API documentation

on:
  push:
    branches:
      - fix/icloud-batch-postmerge-verification
    paths:
      - .github/workflows/pr129-public-docs-repair.yml

permissions:
  contents: read

concurrency:
  group: pr129-public-docs-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/icloud-batch-postmerge-verification
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact audited parent
        env:
          EXPECTED_PARENT: 412e2e36d628303ff4dcf3997fe7926dd14cc23b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr129-public-docs-repair.yml"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Add beginner-readable public API documentation
        shell: python
        run: |
          from pathlib import Path
          import re

          source_path = Path("src-tauri/src/cloud_local_eviction_batch.rs")
          source = source_path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact anchor, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              """pub const ICLOUD_LOCAL_EVICTION_BATCH_VERSION: u32 = 1;
pub const MAX_BATCH_ITEMS: usize = 128;
""",
              """/// Version number serialized into every iCloud local-eviction batch record.
///
/// Readers must reject unsupported versions rather than guessing how to interpret a record.
pub const ICLOUD_LOCAL_EVICTION_BATCH_VERSION: u32 = 1;

/// Maximum number of manifest entries accepted in one iCloud local-eviction batch.
///
/// The bound limits memory use, review scope, and the amount of work authorized by one approval.
pub const MAX_BATCH_ITEMS: usize = 128;
""",
              "public constants",
          )

          old_types = """#[derive(Debug, Clone, PartialEq, Eq, serde::Serialize, serde::Deserialize)]
#[serde(deny_unknown_fields)]
pub struct IcloudLocalEvictionBatchItem {
    pub input_index: u32,
    pub plan: IcloudLocalEvictionPlan,
}

#[derive(Debug, Clone, PartialEq, Eq, serde::Serialize, serde::Deserialize)]
#[serde(deny_unknown_fields)]
