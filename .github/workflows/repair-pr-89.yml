name: Repair PR 89 review findings

on:
  pull_request:
    branches: [main]
    types: [synchronize, ready_for_review]
    paths:
      - .github/workflows/repair-pr-89.yml

permissions:
  contents: read

concurrency:
  group: repair-pr-89-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feat/icloud-local-eviction-batch
          fetch-depth: 0
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Apply bounded review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              return text.replace(old, new, 1)

          cli_path = Path("src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs")
          cli = cli_path.read_text(encoding="utf-8")
          cli = replace_once(
              cli,
              "const MAX_MANIFEST_BYTES: u64 = 1024 * 1024;\n",
              "const MAX_MANIFEST_BYTES: u64 = 1024 * 1024;\nconst HELP_REQUESTED: &str = \"icloud-local-eviction-batch-help-requested\";\n",
              "help sentinel",
          )
          cli = replace_once(
              cli,
              '            "--help" | "-h" => return Err(usage().into()),\n            unknown => return Err(format!("알 수 없는 인자: {unknown}")),',
              '            "--help" | "-h" => return Err(HELP_REQUESTED.into()),\n            _unknown => return Err("알 수 없는 인자".into()),',
              "argument handling",
          )
          cli = replace_once(
              cli,
              '''fn main() {
    if let Err(error) = run() {
        eprintln!("{error}");
        std::process::exit(2);
    }
}''',
              '''fn main() {
    if let Err(error) = run() {
        if error == HELP_REQUESTED {
            println!("{}", usage());
            return;
        }
        eprintln!("{error}");
        std::process::exit(2);
    }
}''',
              "main help handling",
          )
          if "fn parser_distinguishes_help_and_redacts_unknown_values()" not in cli:
              marker = "\n    #[test]\n    fn manifest_reader_is_bounded_and_accepts_extra_evidence_fields() {"
              test = '''
    #[test]
    fn parser_distinguishes_help_and_redacts_unknown_values() {
        assert_eq!(parse_args(&["--help".into()]).unwrap_err(), HELP_REQUESTED);
        let sensitive = "/Users/private/customer-file";
        let error = parse_args(&[sensitive.into()]).unwrap_err();
        assert_eq!(error, "알 수 없는 인자");
        assert!(!error.contains(sensitive));
    }
'''
              cli = replace_once(cli, marker, test + marker, "CLI test insertion")
          cli_path.write_text(cli, encoding="utf-8")

          batch_path = Path("src-tauri/src/cloud_local_eviction_batch.rs")
          batch = batch_path.read_text(encoding="utf-8")
          old_signature = '''#[cfg(not(coverage))]
pub fn execute_icloud_local_eviction_batch(
    root: &CloudRoot,
    plan: &IcloudLocalEvictionBatchPlan,
    approval: &IcloudLocalEvictionBatchApproval,
    confirmation_batch_fingerprint: &str,
    record_dir: &Path,
    requested_at_ms: u64,
) -> Result<IcloudLocalEvictionBatchResult, String> {
    validate_batch_approval(root, plan, approval, confirmation_batch_fingerprint)?;'''
          new_signature = '''#[cfg(not(coverage))]
pub fn execute_icloud_local_eviction_batch(
    root: &CloudRoot,
    plan: &IcloudLocalEvictionBatchPlan,
    approval: &IcloudLocalEvictionBatchApproval,
    confirmation_batch_fingerprint: &str,
    record_dir: &Path,
    requested_at_ms: u64,
) -> Result<IcloudLocalEvictionBatchResult, String> {
    execute_icloud_local_eviction_batch_with_now(
        root,
        plan,
        approval,
        confirmation_batch_fingerprint,
        record_dir,
        requested_at_ms,
        crate::cloud::system_now_ms,
    )
}

#[cfg(not(coverage))]
fn fresh_item_requested_at_ms(now_ms: &mut impl FnMut() -> u64) -> u64 {
    now_ms()
}

#[cfg(not(coverage))]
fn execute_icloud_local_eviction_batch_with_now(
    root: &CloudRoot,
    plan: &IcloudLocalEvictionBatchPlan,
    approval: &IcloudLocalEvictionBatchApproval,
    confirmation_batch_fingerprint: &str,
    record_dir: &Path,
    requested_at_ms: u64,
    mut now_ms: impl FnMut() -> u64,
) -> Result<IcloudLocalEvictionBatchResult, String> {
    validate_batch_approval(root, plan, approval, confirmation_batch_fingerprint)?;'''
          batch = replace_once(batch, old_signature, new_signature, "batch execution wrapper")
          old_loop = '''    for (offset, (item, individual)) in plan
        .items
        .iter()
        .zip(individual_approvals.iter())
        .enumerate()
    {
        let item_requested_at_ms =
            requested_at_ms.saturating_add(u64::try_from(offset).unwrap_or(u64::MAX));'''
          new_loop = '''    for (item, individual) in plan.items.iter().zip(individual_approvals.iter()) {
        let item_requested_at_ms = fresh_item_requested_at_ms(&mut now_ms);'''
          batch = replace_once(batch, old_loop, new_loop, "per-item timestamp")
          if "fn item_execution_timestamps_read_the_clock_for_each_item()" not in batch:
              insertion = '''

    #[test]
    fn item_execution_timestamps_read_the_clock_for_each_item() {
        let next = std::cell::Cell::new(40_u64);
        let mut now_ms = || {
            let current = next.get();
            next.set(current + 7);
            current
        };
        assert_eq!(fresh_item_requested_at_ms(&mut now_ms), 40);
        assert_eq!(fresh_item_requested_at_ms(&mut now_ms), 47);
    }
'''
              closing = batch.rfind("\n}")
              if closing < 0:
                  raise SystemExit("test module closing brace not found")
              batch = batch[:closing] + insertion + batch[closing:]
          batch_path.write_text(batch, encoding="utf-8")

      - name: Format changed Rust files
        run: |
          rustfmt src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs
          rustfmt src-tauri/src/cloud_local_eviction_batch.rs

      - name: Run focused validation
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-icloud-local-eviction-batch
          cargo test --manifest-path src-tauri/Cargo.toml --lib cloud_local_eviction_batch::tests
          cargo check --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-icloud-local-eviction-batch

      - name: Commit validated repair and remove workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-89.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs src-tauri/src/cloud_local_eviction_batch.rs .github/workflows/repair-pr-89.yml
          git diff --cached --check
          git commit -m "fix: address batch eviction review findings"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/icloud-local-eviction-batch
