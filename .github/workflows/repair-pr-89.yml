name: Repair PR 89 review findings

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .github/workflows/repair-pr-89.yml

permissions:
  contents: read

concurrency:
  group: repair-pr-89-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/icloud-local-eviction-batch' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feat/icloud-local-eviction-batch
          fetch-depth: 0
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Apply review fixes and deterministic regressions
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              return text.replace(old, new, 1)

          cli_path = Path("src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs")
          cli = cli_path.read_text(encoding="utf-8")
          if "const HELP_REQUESTED" not in cli:
              cli = replace_once(
                  cli,
                  "const MAX_MANIFEST_BYTES: u64 = 1024 * 1024;\n",
                  "const MAX_MANIFEST_BYTES: u64 = 1024 * 1024;\nconst HELP_REQUESTED: &str = \"icloud-local-eviction-batch-help-requested\";\n",
                  "help sentinel",
              )
          if '"--help" | "-h" => return Err(usage().into())' in cli:
              cli = replace_once(
                  cli,
                  '            "--help" | "-h" => return Err(usage().into()),\n            unknown => return Err(format!("알 수 없는 인자: {unknown}")),',
                  '            "--help" | "-h" => return Err(HELP_REQUESTED.into()),\n            _unknown => return Err("알 수 없는 인자".into()),',
                  "argument privacy",
              )
          if "if error == HELP_REQUESTED" not in cli:
              old_main = dedent(
                  """
                  fn main() {
                      if let Err(error) = run() {
                          eprintln!("{error}");
                          std::process::exit(2);
                      }
                  }
                  """
              ).strip()
              new_main = dedent(
                  """
                  fn main() {
                      if let Err(error) = run() {
                          if error == HELP_REQUESTED {
                              println!("{}", usage());
                              return;
                          }
                          eprintln!("{error}");
                          std::process::exit(2);
                      }
                  }
                  """
              ).strip()
              cli = replace_once(cli, old_main, new_main, "help exit status")
          if "fn parser_distinguishes_help_and_redacts_unknown_values()" not in cli:
              marker = "\n    #[test]\n    fn manifest_reader_is_bounded_and_accepts_extra_evidence_fields() {"
              test = dedent(
                  """

                  #[test]
                  fn parser_distinguishes_help_and_redacts_unknown_values() {
                      assert_eq!(parse_args(&["--help".into()]).unwrap_err(), HELP_REQUESTED);
                      let sensitive = "/Users/private/customer-file";
                      let error = parse_args(&[sensitive.into()]).unwrap_err();
                      assert_eq!(error, "알 수 없는 인자");
                      assert!(!error.contains(sensitive));
                  }
                  """
              )
              cli = replace_once(cli, marker, test + marker, "CLI regressions")
          cli_path.write_text(cli, encoding="utf-8")

          batch_path = Path("src-tauri/src/cloud_local_eviction_batch.rs")
          batch = batch_path.read_text(encoding="utf-8")
          if "fn execute_icloud_local_eviction_batch_with_now(" not in batch:
              old_signature = dedent(
                  """
                  #[cfg(not(coverage))]
                  pub fn execute_icloud_local_eviction_batch(
                      root: &CloudRoot,
                      plan: &IcloudLocalEvictionBatchPlan,
                      approval: &IcloudLocalEvictionBatchApproval,
                      confirmation_batch_fingerprint: &str,
                      record_dir: &Path,
                      requested_at_ms: u64,
                  ) -> Result<IcloudLocalEvictionBatchResult, String> {
                      validate_batch_approval(root, plan, approval, confirmation_batch_fingerprint)?;
                  """
              ).rstrip()
              new_signature = dedent(
                  """
                  #[cfg(not(coverage))]
                  pub fn execute_icloud_local_eviction_batch(
                      root: &CloudRoot,
                      plan: &IcloudLocalEvictionBatchPlan,
                      approval: &IcloudLocalEvictionBatchApproval,
                      confirmation_batch_fingerprint: &str,
                      record_dir: &Path,
                      requested_at_ms: u64,
                  ) -> Result<IcloudLocalEvictionBatchResult, String> {
                      execute_icloud_local_eviction_batch_with_now(
                          root,
                          plan,
                          approval,
                          confirmation_batch_fingerprint,
                          record_dir,
                          requested_at_ms,
                          crate::cloud::system_now_ms,
                      )
                  }

                  #[cfg(not(coverage))]
                  fn fresh_item_requested_at_ms(now_ms: &mut impl FnMut() -> u64) -> u64 {
                      now_ms()
                  }

                  #[cfg(not(coverage))]
                  fn execute_icloud_local_eviction_batch_with_now(
                      root: &CloudRoot,
                      plan: &IcloudLocalEvictionBatchPlan,
                      approval: &IcloudLocalEvictionBatchApproval,
                      confirmation_batch_fingerprint: &str,
                      record_dir: &Path,
                      requested_at_ms: u64,
                      mut now_ms: impl FnMut() -> u64,
                  ) -> Result<IcloudLocalEvictionBatchResult, String> {
                      validate_batch_approval(root, plan, approval, confirmation_batch_fingerprint)?;
                  """
              ).rstrip()
              batch = replace_once(batch, old_signature, new_signature, "clock injection")
          synthetic = dedent(
              """
                  for (offset, (item, individual)) in plan
                      .items
                      .iter()
                      .zip(individual_approvals.iter())
                      .enumerate()
                  {
                      let item_requested_at_ms =
                          requested_at_ms.saturating_add(u64::try_from(offset).unwrap_or(u64::MAX));
              """
          ).rstrip()
          if synthetic in batch:
              batch = replace_once(
                  batch,
                  synthetic,
                  dedent(
                      """
                      for (item, individual) in plan.items.iter().zip(individual_approvals.iter()) {
                          let item_requested_at_ms = fresh_item_requested_at_ms(&mut now_ms);
                      """
                  ).rstrip(),
                  "fresh per-item time",
              )
          if "fn item_execution_timestamps_read_the_clock_for_each_item()" not in batch:
              insertion = dedent(
                  """

                  #[test]
                  fn item_execution_timestamps_read_the_clock_for_each_item() {
                      let next = std::cell::Cell::new(40_u64);
                      let mut now_ms = || {
                          let current = next.get();
                          next.set(current + 7);
                          current
                      };
                      assert_eq!(fresh_item_requested_at_ms(&mut now_ms), 40);
                      assert_eq!(fresh_item_requested_at_ms(&mut now_ms), 47);
                  }
                  """
              )
              closing = batch.rfind("\n}")
              if closing < 0:
                  raise SystemExit("test module closing brace unavailable")
              batch = batch[:closing] + insertion + batch[closing:]
          batch_path.write_text(batch, encoding="utf-8")

      - name: Refresh the lockfile once, then validate locked exact candidate
        run: |
          rustfmt src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs
          rustfmt src-tauri/src/cloud_local_eviction_batch.rs
          cargo check --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-icloud-local-eviction-batch
          git diff --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-icloud-local-eviction-batch
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cloud_local_eviction_batch::tests
          cargo check --locked --manifest-path src-tauri/Cargo.toml --features cloud-cli --bin disksage-icloud-local-eviction-batch

      - name: Publish the validated repair and remove this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-89.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/Cargo.lock src-tauri/src/bin/disksage-icloud-local-eviction-batch.rs src-tauri/src/cloud_local_eviction_batch.rs .github/workflows/repair-pr-89.yml
          git diff --cached --check
          git commit -m "fix: address batch eviction review findings"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/feat/icloud-local-eviction-batch:${ORIGINAL_HEAD} \
            origin HEAD:refs/heads/feat/icloud-local-eviction-batch
