name: Actions registry audit

on:
  pull_request:
    paths:
      - scripts/actions-registry-audit.mjs
      - scripts/actions-registry-audit.test.mjs
      - scripts/actions-registry-audit-state.test.mjs
      - scripts/actions-registry-audit-path-authority.test.mjs
      - scripts/actions-registry-audit-pagination-bound.test.mjs
      - scripts/actions-registry-audit-pr-files-cap.test.mjs
      - scripts/actions-registry-audit-pr-ownership-snapshot.test.mjs
      - scripts/actions-registry-audit-tree-integrity.test.mjs
      - scripts/actions-registry-audit-workflow.test.mjs
      - .github/workflows/actions-registry-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/actions-registry-audit.mjs
      - scripts/actions-registry-audit.test.mjs
      - scripts/actions-registry-audit-state.test.mjs
      - scripts/actions-registry-audit-path-authority.test.mjs
      - scripts/actions-registry-audit-pagination-bound.test.mjs
      - scripts/actions-registry-audit-pr-files-cap.test.mjs
      - scripts/actions-registry-audit-pr-ownership-snapshot.test.mjs
      - scripts/actions-registry-audit-tree-integrity.test.mjs
      - scripts/actions-registry-audit-workflow.test.mjs
      - .github/workflows/actions-registry-audit.yml
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Native test include/threshold coverage flags require Node >=22.8.0.
          node-version: 22.18.0
      - name: Exact audit-module coverage
        env:
          NODE_V8_COVERAGE: .coverage/actions-registry-audit
        run: |
          set +e
          node --experimental-test-coverage \
            --test-coverage-include='scripts/actions-registry-audit.mjs' \
            --test-coverage-lines=100 \
            --test-coverage-branches=100 \
            --test-coverage-functions=100 \
            --test scripts/actions-registry-audit.test.mjs \
            scripts/actions-registry-audit-state.test.mjs \
            scripts/actions-registry-audit-path-authority.test.mjs \
            scripts/actions-registry-audit-pagination-bound.test.mjs \
            scripts/actions-registry-audit-pr-files-cap.test.mjs \
            scripts/actions-registry-audit-pr-ownership-snapshot.test.mjs \
            scripts/actions-registry-audit-tree-integrity.test.mjs \
            scripts/actions-registry-audit-workflow.test.mjs
          coverage_status=$?

          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          import { resolve } from 'node:path';

          const coverageDir = resolve('.coverage/actions-registry-audit');
          const sourcePath = resolve('scripts/actions-registry-audit.mjs');
          const source = readFileSync(sourcePath, 'utf8');
          const ranges = new Map();
          for (const filename of readdirSync(coverageDir)) {
            const payload = JSON.parse(readFileSync(resolve(coverageDir, filename), 'utf8'));
            for (const script of payload.result ?? []) {
              if (!script.url.endsWith('/scripts/actions-registry-audit.mjs')) continue;
              for (const fn of script.functions ?? []) {
                for (const range of fn.ranges ?? []) {
                  const key = `${range.startOffset}:${range.endOffset}`;
                  const existing = ranges.get(key) ?? {
                    startOffset: range.startOffset,
                    endOffset: range.endOffset,
                    count: 0,
                  };
                  existing.count += range.count;
                  ranges.set(key, existing);
                }
              }
            }
          }
          const zeroRanges = [...ranges.values()]
            .filter((range) => range.count === 0)
            .map((range) => {
              const prefix = source.slice(0, range.startOffset);
              const line = prefix.split('\n').length;
              const lastNewline = prefix.lastIndexOf('\n');
              const column = range.startOffset - lastNewline;
              return {
                line,
                column,
                start_offset: range.startOffset,
                end_offset: range.endOffset,
                snippet: source.slice(range.startOffset, Math.min(range.endOffset, range.startOffset + 160)),
              };
            })
            .sort((left, right) => left.start_offset - right.start_offset);
          console.log(`actions-registry-zero-count-ranges=${JSON.stringify(zeroRanges)}`);
          NODE
          diagnostic_status=$?
          set -e

          if [ "$diagnostic_status" -ne 0 ]; then
            echo "::warning::actions registry coverage diagnostic failed with status $diagnostic_status"
          fi
          exit "$coverage_status"

  live-registry:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
      - name: Audit complete live Actions registry against exact protected main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { auditActionsRegistry } from './scripts/actions-registry-audit.mjs';

          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const expectedMainSha = process.env.EXPECTED_MAIN_SHA;
          if (!repository || !token || !expectedMainSha) {
            throw new Error('actions-registry-audit-input-missing');
          }

          const pause = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const fetchJson = async (pathname) => {
            const headers = {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
            };
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              let response;
              try {
                response = await fetch(`https://api.github.com${pathname}`, {
                  headers,
                  signal: AbortSignal.timeout(15_000),
                });
              } catch (error) {
                if (attempt >= 3) throw error;
                await pause(attempt * 1_000);
                continue;
              }
              if (response.ok) return response.json();
              const retryable = response.status === 429 || response.status >= 500;
              if (!retryable || attempt >= 3) throw new Error(`github-api-${response.status}`);
              await pause(attempt * 1_000);
            }
          };

          const report = await auditActionsRegistry(fetchJson, repository, expectedMainSha);
          console.log(JSON.stringify(report, null, 2));
          if (report.orphaned_records.length > 0) {
            throw new Error(`orphaned-actions-workflows:${report.orphaned_records.length}`);
          }
          NODE
