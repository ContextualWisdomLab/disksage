name: PR 138 Release Version Repair

on:
  push:
    branches:
      - feat/release-provenance-attestation
    paths:
      - .github/workflows/pr138-release-version-repair.yml

permissions:
  contents: read

concurrency:
  group: pr138-release-version-repair
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'stage PR 138 release version repair')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/release-provenance-attestation
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse stale or unexpected source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/release-provenance-attestation"
          git fetch --no-tags origin feat/release-provenance-attestation
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feat/release-provenance-attestation)" = "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0

      - name: Install exact JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Prove the release version contract is red
        shell: bash
        run: |
          set -euo pipefail
          npx svelte-kit sync
          if npx vitest run src/lib/releaseVersionContract.test.ts; then
            echo "Expected the release-version contract to fail before workflow implementation." >&2
            exit 1
          fi

      - name: Apply exact reviewed release version repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one reviewed anchor, found {count}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              ".github/workflows/release.yml",
              """      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                  node-version: 20
              - run: npm ci
          """,
              """      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                  node-version: 20

              - name: Verify release version contract
                shell: bash
                run: |
                  set -euo pipefail
                  node --input-type=module <<'NODE'
                  import { readFileSync } from 'node:fs';

                  function refuse(message) {
                    console.error(message);
                    process.exit(1);
                  }

                  function readJsonVersion(path) {
                    let parsed;
                    try {
                      parsed = JSON.parse(readFileSync(path, 'utf8'));
                    } catch {
                      refuse(`Release manifest ${path} is missing or invalid JSON.`);
                    }
                    if (typeof parsed.version !== 'string' || parsed.version.length === 0) {
                      refuse(`Release manifest ${path} must define one non-empty string version.`);
                    }
                    return parsed.version;
                  }

                  function readCargoPackageVersion(path) {
                    const lines = readFileSync(path, 'utf8').split(/\\r?\\n/);
                    let inPackage = false;
                    const versions = [];
                    for (const line of lines) {
                      const trimmed = line.trim();
                      if (trimmed === '[package]') {
                        inPackage = true;
                        continue;
                      }
                      if (inPackage && /^\\[.*\\]$/.test(trimmed)) break;
                      if (!inPackage) continue;
                      const match = line.match(/^\\s*version\\s*=\\s*"([^"]+)"\\s*(?:#.*)?$/);
                      if (match) versions.push(match[1]);
                    }
                    if (versions.length !== 1) {
                      refuse(`Release manifest ${path} must define exactly one package version.`);
                    }
                    return versions[0];
                  }

                  const packageVersion = readJsonVersion('package.json');
                  const cargoVersion = readCargoPackageVersion('src-tauri/Cargo.toml');
                  const tauriVersion = readJsonVersion('src-tauri/tauri.conf.json');
                  if (packageVersion !== cargoVersion || packageVersion !== tauriVersion) {
                    refuse(
                      `Release manifest versions disagree: package.json=${packageVersion}, Cargo.toml=${cargoVersion}, tauri.conf.json=${tauriVersion}.`,
                    );
                  }

                  const semver = /^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$/;
                  if (!semver.test(packageVersion)) {
                    refuse(`Release manifest version ${packageVersion} is not valid Semantic Versioning.`);
                  }

                  if ((process.env.GITHUB_REF ?? '').startsWith('refs/tags/')) {
                    const expectedTag = `v${packageVersion}`;
                    const actualTag = process.env.GITHUB_REF_NAME ?? '';
                    if (actualTag !== expectedTag) {
                      refuse(
                        `Release tag ${actualTag} does not match manifest version ${expectedTag}.`,
                      );
                    }
                  }

                  console.log(`Release version contract passed for ${packageVersion}.`);
                  NODE

              - run: npm ci
          """,
          )

          replace_exact(
              "docs/doctoring/release-artifact-provenance.md",
              """- checkout binds every platform build to `github.event.pull_request.head.sha` for pull requests and `github.sha` for tags or manual runs, rather than silently treating a generated pull-request merge ref as exact-head evidence;
          """,
              """- checkout binds every platform build to `github.event.pull_request.head.sha` for pull requests and `github.sha` for tags or manual runs, rather than silently treating a generated pull-request merge ref as exact-head evidence;
          - `package.json`, `src-tauri/Cargo.toml`, and `src-tauri/tauri.conf.json` must expose one identical Semantic Versioning value before dependencies, compilation, packaging, attestation, or publication proceed;
          - a tag-triggered run must use the exact tag `v<manifest version>`; tag or manifest drift fails before release artifacts are built;
          """,
          )

          replace_exact(
              "docs/doctoring/release-artifact-provenance.md",
              """The pipeline fails closed when an expected platform bundle, operational CLI, or checksum file is absent or duplicated.
          """,
              """The pipeline fails closed when the package, Cargo, and Tauri manifest versions disagree, when a version is missing or malformed, or when a release tag is not exactly `v<manifest version>`. It also fails closed when an expected platform bundle, operational CLI, or checksum file is absent or duplicated.
          """,
          )

          replace_exact(
              "docs/doctoring/release-artifact-provenance.md",
              """## Reference verification note
          """,
              """npm, Inc. (n.d.). *Creating a package.json file*. npm Docs. Retrieved August 6, 2026, from https://docs.npmjs.com/creating-a-package-json-file/

          Rust Project. (n.d.). *The manifest format*. The Cargo Book. Retrieved August 6, 2026, from https://doc.rust-lang.org/cargo/reference/manifest.html

          Semantic Versioning. (n.d.). *Semantic Versioning 2.0.0*. Retrieved August 6, 2026, from https://semver.org/spec/v2.0.0.html

          Tauri Programme within The Commons Conservancy. (n.d.). *Distribute*. Tauri. Retrieved August 6, 2026, from https://v2.tauri.app/distribute/

          ## Reference verification note
          """,
          )

          replace_exact(
              "CHANGELOG.md",
              """- Added buyer-verifiable release artifact provenance with checksum-first admission, immutable `actions/attest` pinning, tag-only OIDC and attestation authority, and publication that depends on successful exact-artifact provenance generation.
          """,
              """- Added buyer-verifiable release artifact provenance with checksum-first admission, immutable `actions/attest` pinning, tag-only OIDC and attestation authority, and publication that depends on successful exact-artifact provenance generation.
          - Fail closed before release builds when `package.json`, Cargo, and Tauri versions disagree or when a release tag is not exactly `v<manifest version>`.
          """,
          )

          workflow = Path('.github/workflows/pr138-release-version-repair.yml')
          if not workflow.is_file():
              raise SystemExit('one-shot workflow source is missing')
          workflow.unlink()
          PY

      - name: Verify the release version contract is green
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run src/lib/releaseVersionContract.test.ts
          npm run coverage
          git diff --check

      - name: Commit only the verified exact repair
        shell: bash
        env:
          BRANCH_NAME: feat/release-provenance-attestation
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH_NAME"
          test "$(git rev-parse origin/$BRANCH_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/release.yml .github/workflows/pr138-release-version-repair.yml docs/doctoring/release-artifact-provenance.md CHANGELOG.md
          git diff --cached --check
          changed="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/pr138-release-version-repair.yml .github/workflows/release.yml CHANGELOG.md docs/doctoring/release-artifact-provenance.md | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git commit -m "fix(release): bind tags to packaged versions"
          git push origin "HEAD:$BRANCH_NAME"
