name: Repair PR 186 local eviction authority

on:
  push:
    branches:
      - security/cloud-receipt-private-authority-v1
    paths:
      - .github/workflows/repair-pr186-local-eviction-authority.yml

permissions:
  contents: write

concurrency:
  group: repair-pr186-local-eviction-authority
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/cloud-receipt-private-authority-v1
          fetch-depth: 2

      - name: Verify exact parent and isolated trigger
        env:
          EXPECTED_PARENT: 2abefde942d6723fec01baa837e4d04f10b804a4
          TRIGGER_PATH: .github/workflows/repair-pr186-local-eviction-authority.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "${{ github.event.before }}" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$TRIGGER_PATH"

      - name: Apply fail-closed authority repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/cloud_local_eviction.rs")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''    if directory.file_type().is_symlink() || !directory.is_dir() {
                  return Err("record-dir-not-real-directory".into());
              }
              let path = record_dir.join(filename);
              ''',
                  '''    if directory.file_type().is_symlink() || !directory.is_dir() {
                  return Err("record-dir-not-real-directory".into());
              }
              #[cfg(unix)]
              {
                  use std::os::unix::fs::PermissionsExt;
                  if directory.permissions().mode() & 0o022 != 0 {
                      return Err("icloud-local-eviction-record-dir-writable-by-others".into());
                  }
              }
              let path = record_dir.join(filename);
              ''',
              ),
              (
                  '''    let mut file = std::fs::OpenOptions::new()
                  .write(true)
                  .create_new(true)
                  .open(&path)
                  .map_err(|error| error.to_string())?;
              ''',
                  '''    let mut options = std::fs::OpenOptions::new();
              options.write(true).create_new(true);
              #[cfg(unix)]
              {
                  use std::os::unix::fs::OpenOptionsExt;
                  options.mode(0o400);
              }
              let mut file = options
                  .open(&path)
                  .map_err(|error| error.to_string())?;
              ''',
              ),
              (
                  '''        permissions.set_readonly(true);
              std::fs::set_permissions(&path, permissions).map_err(|error| error.to_string())?;
              ''',
                  '''        #[cfg(unix)]
              {
                  use std::os::unix::fs::PermissionsExt;
                  permissions.set_mode(0o400);
              }
              #[cfg(not(unix))]
              permissions.set_readonly(true);
              file.set_permissions(permissions)
                  .map_err(|error| error.to_string())?;
              ''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one exact replacement, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Verify focused RED to GREEN contracts
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --test cloud_receipt_private_authority
          cargo test --manifest-path src-tauri/Cargo.toml --test icloud_local_eviction_record_authority

      - name: Verify full Rust suite
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Commit only the verified repair
        env:
          BRANCH_NAME: security/cloud-receipt-private-authority-v1
          TRIGGER_PATH: .github/workflows/repair-pr186-local-eviction-authority.yml
        run: |
          set -euo pipefail
          rm "$TRIGGER_PATH"
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/repair-pr186-local-eviction-authority.yml\nsrc-tauri/src/cloud_local_eviction.rs'
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-agent@users.noreply.github.com"
          git add src-tauri/src/cloud_local_eviction.rs "$TRIGGER_PATH"
          git commit -m "security: privatize local eviction authority records"
          git fetch origin "$BRANCH_NAME"
          test "$(git rev-parse "origin/$BRANCH_NAME")" = "$(git rev-parse HEAD^)"
          git push origin "HEAD:$BRANCH_NAME"
