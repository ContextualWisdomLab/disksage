name: PR133 Rustfmt Diff

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/pr133-rustfmt-diff.yml"

permissions:
  contents: read

concurrency:
  group: pr133-rustfmt-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rustfmt-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt
      - name: Generate exact rustfmt diff
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --binary > rustfmt.patch
          test -s rustfmt.patch
          git diff --check
      - name: Upload exact rustfmt diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr133-rustfmt-diff
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 1
